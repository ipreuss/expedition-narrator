nemeses:
- name: Rageborne
  box: Aeon's End (Core Set)
  difficulty: 2
  life: 70
  battle: 1
  background: |
    Rageborne is one of the earliest Nameless encountered by Gravehold.  The long
    war has hardened children into warriors and stripped joy from daily life, and
    Rageborne embodies that relentless brutality.  It is described as the executioner
    champion of the Nameless, a hulking beast with blades and horns that
    demonstrates pure force rather than cunning.  Survivors speak of its roar
    echoing across chasms and of battles where its body vanished into darkness
    without a sound, leaving them uncertain if it was truly gone.
  appearance: |
    A massive, rage-distorted creature with archaic design.  Its body is
    primitively brutal, dominated by immense musculature and aggressive
    posture.  Horns protrude from its skull and bulky blades are attached
    to its arms.
  strengths: |
    Focuses on direct, massive damage against mages and Gravehold.
    Accumulates Fury tokens and triggers devastating Strikes from a
    separate card deck.
  weaknesses: |
    Lacks strategic complexity; beginner-friendly to defeat and does not
    scale well against experienced players.
  special_rules: |
    Rageborne starts with one Fury token.  Each Unleash grants an additional
    token.  At four or more tokens, a Strike is triggered and three tokens
    are consumed.
- name: Carapace Queen
  box: Aeon's End (Core Set)
  battle: 1
  background: |
    The Carapace Queen—also called the Mother-of-Husks and the Swarm Daughter—is one
    of the most ruinous Nameless to ever strike Gravehold.  Chroniclers describe the
    titles as "dread names," each a failed attempt to make sense of a threat that
    behaves less like a beast and more like an engine of replication.

    Her armies are vast and lethal, a marching ecology of metallic husks that overrun
    defenders through attrition.  Veterans say that killing one husk is often the
    prelude to many more, and that true relief comes only when the Queen herself
    retreats through the Void.
  difficulty: 3
  life: 60
  appearance: |
    A towering, arachnid queen with white-chitin armor plates shaped like blades and
    shields, supported by long, bone-thin scythe limbs.
    Her face is crowned by clustered crimson eyes beneath a skull-like crest, while
    segmented forelimbs fold and spread like ceremonial weapons.
    At her feet churn dense carpets of small husks, each with dim red eye-glow,
    giving the impression that the battlefield itself is hatching.
  strengths: |
    Massive husk production quickly creates overwhelming numbers.  Swarm
    effects punish players based on husk count with escalating consequences
    up to instant loss.
  weaknesses: |
    With 60 life points, relatively low health.  Turn order manipulation can
    reduce its explosive potential.  AoE damage or multi-hit spells are
    particularly valuable against the husks.
  story_notes: |
    Gravehold veterans recite a bitter proverb before every assault: "To kill one
    is to breed six."  The saying comes from hard experience with Carapace Queen
    broods that multiply faster than defenders can burn them down.

    Field reports add a grim aftermath detail: after each siege, crews spend weeks
    shoveling metallic husk scraps into deep cave pits, where the dead keep the same
    rigid countenances and dim red eyes they had in life.

    When the Queen withdraws through the Void, her swarm finally slows and the
    surviving husks collapse where they stand.  Breach mages use that narrow window
    to regroup, triage the wounded, and destroy dormant brood-clusters before they
    reactivate.  Any delay risks another wave spilling from deep caverns and
    overrunning the city walls.
  special_rules: |
    Each husk has 1 life.  Players may suffer 1 damage to distribute excess
    damage to additional husks.  At 15+ husks, Gravehold suffers 1 damage
    instead of spawning a new husk.  At 13+ husks, players lose immediately.
- name: Crooked Mask
  box: Aeon's End (Core Set)
  battle: 2
  background: |
    Elders whisper that Crooked Mask is a god of corruption whose weapon is
    temptation.  This Nameless feeds on desire, offering survivors what they
    most crave in exchange for their souls.

    The elders of Gravehold say there is a god for every force in existence,
    and if that belief is true, then Crooked Mask's domain is corruption.
    Survivors ask how anyone can slay such a being when, after years of siege
    and scarcity, restraint itself becomes a battlefield.

    Many in Gravehold murmur that behind its warped visage hides a cruel,
    desolate grin.  In battle they hear a thin laugh beneath the bells and the
    screams, while vivid dreams and intrusive thoughts spread through the ranks.
    Only discipline, trust, and mutual vigilance keep a breach mage from being
    quietly turned against their own allies.
  difficulty: 5
  life: 70
  appearance: |
    A menacing entity with a crooked, distorted mask, now revealed in fuller
    detail as a gaunt, regal horror draped in torn violet robes.  A jagged
    golden crown frames a split visage stretched over a maw of sharp teeth,
    while corpse-green limbs end in long hooked claws raised like a puppeteer
    conducting the panic below.

    Brass fittings and bell-like ornaments hang at its side, reinforcing the
    impression of a ceremonial executioner.  The posture is theatrical rather
    than bestial: one hand lifted high in invitation, the other curled as if
    closing around an unseen bargain.  Every visual detail suggests decay,
    seduction, and calculated cruelty rather than brute force.
  strengths: |
    Uses a secondary Corruption deck to place debilitating cards into player
    decks and hands.  Corruptions trigger at turn start and after drawing.
    Destroyed Corruptions return to the bottom of the deck.
  weaknesses: |
    Players can win through careful resource management and resisting
    temptation.
  special_rules: |
    On each Unleash, a player gains a Corruption placed atop their deck,
    then shuffles their discard pile into their deck.  Destroyed Corruptions
    return to the bottom of the Corruption deck.
- name: Prince of Gluttons
  box: Aeon's End (Core Set)
  difficulty: 5
  life: 70
  battle: 1
  background: |
    Long ago, when the world was swallowed by darkness, survivors huddled in
    Gravehold to preserve what little remained of their history.  The Prince of
    Gluttons was among the Nameless that besieged them.  At first it seemed
    harmless, but after its passing people realised they could not recall where
    they had come from.  This creature devours memories, history and even the
    words of ancestors, leaving its victims adrift in the present with no
    connection to their past.  It slithers silently through tunnels, erasing
    inscriptions and names wherever it goes.
  appearance: |
    A many-headed monstrosity with numerous maws that devour cards and
    memories.  Its body winds serpent-like through the tunnels.
  strengths: |
    Devours cards from supply piles, depriving players of resources.  The
    devoured cards form a separate pile.
  weaknesses: |
    Players can purchase cards from the Devour pile.  With high damage
    and a quick end to the game, the Prince can be starved out.
  special_rules: |
    On Unleash, it devours 2-3 cards from the cheapest pile.  Empty supply
    piles deal 2 damage per missing card.  Players lose if any supply pile
    (except the Devour pile) is empty.
- name: Gate Witch
  box: War Eternal
  difficulty: 7
  life: 70
  battle: 4
  background: |
    The Gate Witch is a time-twisting entity that emerges from breaches and monoliths to warp
    reality.  She manipulates the sequence of events, reversing or accelerating moments at will,
    and hides within ragged robes and clawed hands.  Entire battles can feel like they are
    unfolding twice as fast or barely moving at all under her influence.  Some of her invocations
    linger, cycling back again and again, making it impossible to outlast her by simple attrition.
  appearance: |
    A dark, supernatural being with time-manipulating aesthetics.  Her presence
    seems to distort space and time.  Long claws protrude from tattered robes,
    and she is surrounded by otherworldly elements and a menacing aura.
  strengths: |
    Specializes in manipulating the Turn Order Deck.  After accumulating enough
    tokens, she can shuffle a nemesis card from the discard pile back into the
    deck.  Three of her cards always return to the deck—a milling victory is
    impossible.
  weaknesses: |
    Her temporal weaving grows slowly; fast and decisive actions can disrupt
    her and prevent her from gaining momentum.
  special_rules: |
    On each Unleash, she gains a Nemesis token.  At increased difficulty, she
    loses 3 instead of 4 tokens on time acceleration.
- name: Umbra Titan
  box: War Eternal
  difficulty: 3
  life: 70
  battle: 1
  background: |
    A colossal leviathan from the Void, the Umbra Titan surged up from the remains of the
    Thrice-Dead Prophet and threatened to drag the city into darkness.  Indira describes
    it as a manic and feral beast with little recognizable intelligence.  It is worshipped
    by dark creatures and threatens Gravehold through its burrowing and rampaging.

    Indira's account stresses the shock of witnessing a Nameless "born" rather than
    slain: the Titan spears out of the Prophet's carcass like foul offspring, first
    mistaken for another grotesque minion before proving itself an equal-scale threat.
    Its emergence reframes the war as an ecosystem event, where even defeated horrors
    may become breeding grounds for new catastrophes.
  appearance: |
    In the card art, Umbra Titan appears as a burrowing macro-predator with a
    segmented black carapace and broad, shield-like side plates etched in pale
    chevron patterns.  At its center, a flower-like maw glows amber-yellow, as if
    a furnace were embedded in living armor.

    Blue crystal-like protrusions stud its head and flanks, while red membrane fins
    frame the crown behind a jagged, tooth-lined snout.  The body coils through ash
    and broken stone, giving the impression of something that tunnels by force and
    heat, then erupts upward without warning.
  strengths: |
    High life points and aggressive minions.  The token-loss mechanic creates
    pressure.  Minions are optimized for token loss.
  weaknesses: |
    Dependent on Turn Order card placement.  Players can choose damage instead
    of token loss.  Mages with early damage and healing are advantageous.
  special_rules: |
    Starts with 8 Nemesis tokens as a countdown to Gravehold's destruction.  At
    zero tokens, players lose.  Unleash effect: Depending on Nemesis card pile,
    a player or Gravehold suffers 2 damage, OR the Titan loses a token.  At
    increased difficulty, it starts with only 5 tokens.
  story_notes: |
    Narrate Umbra Titan as feral inevitability.  The dread starts before contact:
    tremors underfoot, collapsing routes, and civilians freezing in place because
    they cannot tell where it will surface.

    Keep Indira's distinction explicit: this is not a cunning mastermind, nor a god
    despite cult reverence—just predatory instinct at colossal scale.  That framing
    helps stories emphasize panic management, shelter discipline, and the emotional
    strain of fighting an adversary that feels more like a natural disaster than a
    military opponent.
- name: Hollow Crown
  box: War Eternal
  difficulty: 5
  life: 1
  battle: 3
  background: |
    Survivors whisper of dark machinations within Gravehold.  Indira, a breach apprentice, writes that their numbers wane despite the arrival of Yan Magda and her companions.  Faith has kept them alive, yet it is precisely faith that the Hollow Crown craves.  Its acolytes were once mages performing forbidden blood rituals in the rubble of the Craghollows; through their devotion the Crown draws strength and becomes unstoppable.  Unlike other Nameless it does not inspire terror but reverence.  It regards the people of Gravehold not as victims but as would-be worshippers, and it sees the city itself as a cage for its subject—thus it has little reason to destroy its captives.
  appearance: |
    A tall, sinewy creature with exposed red musculature and bone-white armour plating.  It wears a hollow, crown-shaped helm that encases its head and shoulders.  In one hand it carries a staff or sceptre, and in the other it gestures as if offering something unseen.  Veins glow faintly beneath its skin, hinting at the blood magic it employs.
  strengths: |
    The Hollow Crown compels reverence in those who behold it.  Its masked acolytes,
    former mages turned blood-magic cultists, willingly sacrifice their own vitality
    to feed its power.  The Crown siphons life from their devotions, growing stronger
    as their faith intensifies and using forbidden rituals to sap strength from its
    enemies.  Tier-3 cards can trigger all acolyte effects simultaneously.
  weaknesses: |
    Its influence depends on the unwavering devotion of its followers.  By breaking
    the thrall of its acolytes, exposing its true intentions or disrupting its
    blood-magic rites, defenders can sever the Crown's source of power.  The Nameless
    itself cannot be harmed directly until its congregation is freed or destroyed.
  special_rules: |
    The Crown cannot take normal damage.  Acolytes perform blood magic effects—on
    Unleash, the effect of the strongest acolyte is triggered.  Victory: End a round
    with no acolytes in play.  New acolytes are drawn when old ones are discarded.
  story_notes: |
    Indira warns that conspiracies within Gravehold are eroding the survivors' faith.  She observes that the Crown's followers are driven not by fear but by awe and a promise of power.  Their blood rituals repulse her, yet she notes that the Crown regards them as potential worshippers, not prey.  Indira reflects that Gravehold has become a cage for those under the Crown's sway; unless they confront the cult's allure, there may be fates worse than death.  Ohat suggests that death is the worst fate, but she disagrees.
- name: Magus of Cloaks
  box: War Eternal
  difficulty: 7
  life: 35
  battle: 3
  background: |
    The Magus of Cloaks is a faceless terror wrapped in innumerable layers of black fabric.
    Each cloak is woven with void threads that absorb light and even memories.  As he glides
    through the air he leaves trails of shadow that crawl like worms, and his followers echo
    his movements in ragged unison.  Only by peeling away his veils one by one and enduring
    the darkness beneath can the mages hope to glimpse the form hidden at the centre.
    "We live in darkness.  Darkness and silence...  The Magus is a thing of darkness.
    With every blow, we merely peel away one cloak of shadow to reveal another."
  appearance: |
    A mystical creature wrapped in multiple layers of darkness.  The dominant
    colouring is dark blue and black with mystical effects representing the
    "cloaks" of shadow.  Only glowing eyes are visible.  The figure appears
    ethereal and menacing.
  strengths: |
    Layer-based defence through tokens makes direct damage initially ineffective.
    Minions are likewise resilient.  Powers cannot be discarded through Aether
    expenditure.  Enemy card effects continuously generate new tokens.
  weaknesses: |
    Requires relentless endurance—consistent attacks to reduce tokens.  Mages
    with piercing damage sources are effective.  The token maximum limits
    token accumulation.
  special_rules: |
    Starts with 4 Nemesis tokens.  Tokens reduce damage received by their number.
    After damage calculation, the Magus loses 1 token.  Minimum: 2 tokens,
    'Maximum: 8 tokens.  Unleash: Either the Magus gains 2 tokens OR Gravehold'
    suffers 2 damage.  At increased difficulty: Minimum 3, Maximum 9 tokens.
- name: Arachnos
  box: The New Age
  battle: 2
  background: |
    Arachnos was once a respected breach mage and close adherent of Xaxos's doctrines.
    Convinced that Void experimentation could be refined into salvation, he continued
    forbidden research even after censure and exile.  His faction framed itself as
    pragmatic reformers, but desperation and ambition pushed the work toward increasingly
    unstable rituals.

    Brama's Envelope 2a account clarifies the fracture: when the Council condemned his
    work, Arachnos organized like-minded followers into open rebellion, was outnumbered,
    and banished from New Gravehold.  Exile did not cool his conviction.  He and his
    circle kept refining Xaxos-inspired designs in the wild, increasingly willing to cut
    safety checks and human limits in the name of speed.

    The result was self-transformation.  Arachnos fused human and arachnid forms, then
    extended the same logic to living test subjects, claiming every violation was a
    necessary step toward "protecting" humanity.  Brama's warning makes the political
    danger explicit: this is not only a Nameless threat, but proof that human zeal can
    produce horrors as devastating as the Void itself.
  appearance: |
    In the illustration, Arachnos hangs at the center of a towering lattice of bone-like
    spider limbs, with a humanoid torso suspended amid webbing like a commander riding
    his own war-engine.  The leg structures are elongated and spear-tipped, forming a
    moving cage that can stride over roots and stone while enclosing prey.

    Pale web strands connect limb to limb and drape across surrounding trees, turning the
    entire clearing into a ritual snare.  The scene reads less like an ambush predator's
    nest and more like a mobile laboratory built from living anatomy.

    His upper body still carries formal mage vestments in deep blue and red, but the
    face is obscured by clustered, cold-blue ocular growths where human features should
    be.  That clash—scholar's robes over an engineered spider chassis—makes him look
    like a researcher who physically merged with his own thesis.
  strengths: |
    Arachnos pressures both tempo and positioning through his Ritual Track system.
    Unleash advances the track, escalating world-devourer effects unless players spend
    aether to push the token back.  This creates a constant resource dilemma between
    immediate survival, market development, and long-term track control.

    He compounds that pressure with web-themed minion support and direct aggression,
    forcing teams to split attention between board cleanup and preventing ritual
    thresholds from triggering catastrophic effects.
  weaknesses: |
    His power loop is interactive and therefore disruptable.  Teams that coordinate
    aether spending to manage Ritual Track movement, remove support minions quickly,
    and time burst turns around lower ritual states can keep Arachnos from snowballing.
    Once ritual acceleration is contained, his raw durability becomes manageable.
  special_rules: |
    Use the Ritual Track and place the Arachnos token on its start space during setup.
    Unleash: Move the Arachnos token one space forward on the Ritual Track.  Players may
    spend charges equal to the current space value to move the token one space backward.

    At increased difficulty, Arachnos starts with 2 Nemesis tokens and resolves Unleash
    twice at setup.
  story_notes: |
    Narrate Arachnos as a fallen intellectual, not a mindless beast.  He should sound
    convinced he is still right—calmly justifying atrocities as necessary iteration.

    The emotional core is betrayal with civic fallout: the party is fighting someone who
    once shared their language, methods, and hopes, and who turned those shared ideals
    into predation.  Fold in rumors that citizens still imagine him as merely "reduced"
    in the wild; the truth of what he became is destabilizing enough to fracture public
    trust if handled poorly.
- name: Horde-Crone
  box: The Depths
  difficulty: 6
  life: 60
  battle: 3
  background: |
    Horde-Crone awoke deep beneath Gravehold and summoned hordes of ancient
    troggs to attack the city.  The troggs were once divided into three tribes:
    the Yud (creators), the Orp (destroyers) and the Zom (thinkers).  They had
    once maintained harmony before falling into slumber.  Now they have awakened
    with evil and malicious intent.
  appearance: |
    A grotesquely gaunt creature with ancient, subterranean aesthetics.  Its body
    appears withered and bony, surrounded by a horde of smaller trogg creatures
    crawling from tunnels and crevices in the ground.  Its face is marked by
    demonic features and its long fingers reach commandingly toward its minions.
  strengths: |
    Horde-oriented design with large numbers of minions.  Troggs trigger
    progressive effects based on their frequency in play.  The Trogg deck
    constantly recycles through shuffling the discard pile.
  weaknesses: |
    Has limited ability to directly harm players.  If the troggs are kept under
    control, she can be defeated.
  special_rules: |
    Uses a secondary Trogg deck with three trogg types (4 cards each).  On
    Unleash, the trogg discard pile is shuffled into the deck and a new trogg
    is played.  At increased difficulty, all troggs have 3 instead of 2
    life points.
- name: Blight Lord
  box: The Nameless
  difficulty: 4
  life: 70
  battle: 3
  background: |
    The Blight Lord is remembered as the first of the Nameless to set foot in
    the old world, and its arrival marked the beginning of a catastrophe still
    treated as sacred warning.  Chronicles describe the fall of Karek in a single,
    deliberate gesture: streets, towers, and fleeing crowds sealed inside a mountain
    of green glass.  The harbor towns of M'blark were next to fall, their warm waters lapping against
    jagged, frozen shapes of those caught unaware.

    The elder of the First Tribe once urged tribute, mistaking it for a divine messenger.
    None who knelt were spared.  That betrayal of hope is why survivors named it
    "Blight Lord"—for the merciless ruin that trails behind it like a plague.
  appearance: |
    The Blight Lord resembles a colossal, many-limbed predator crawling low to the
    ground, its frame wrapped in bladed crystalline protrusions like a living crown
    of splintered jade.  Its foremost limbs are oversized and asymmetrical, ending in
    heavy, club-like growths studded with shards that look capable of crushing and
    petrifying in the same strike.

    In the illustration, the whole body is cast in smoky green-grey light, as if seen
    through tainted fog.  A faceted, triangular maw hangs beneath its armored chest,
    while glass spikes fan from its shoulders and back, reinforcing the sense that the
    creature is less a beast of flesh than an advancing landslide of corrupted crystal.
  strengths: |
    The Blight Lord weaponizes corruption through Tainted Jade pressure.  It floods
    player decks with harmful gems that clog draws, distort economy, and punish attempts
    to convert them into normal tempo.  At the same time, its track advancement creates
    an escalating doom clock that can end the battle regardless of remaining life.
  weaknesses: |
    Its win condition is telegraphed and therefore contestable.  Teams that coordinate
    Tainted Jade handling, preserve discard control, and repeatedly interrupt track
    progression can strip away its inevitability.  Once that pressure loop is contained,
    the Blight Lord can be brought down through disciplined, sustained damage.
  special_rules: |
    Uses a secondary Tainted Jade deck.  The Blight Lord advances on a
    Tainted Track—if it reaches the end, players lose immediately.  When
    the supply pile is empty, the affected player suffers 1 damage per card.
    At increased difficulty, two Tainted Jades are removed at game start.
  story_notes: |
    Narratively, Blight Lord should feel like confronting a historical apocalypse
    made present.  Every tainted gem represents not just inconvenience, but the same
    creeping corruption that entombed entire cities.

    Emphasize the moral wound in the lore: people once knelt before this force and
    were annihilated anyway.  The mages are fighting both a Nemesis and the return of
    a trauma their ancestors never truly survived.
- name: Wayward One
  box: The Nameless
  difficulty: 7
  life: 60
  battle: 3
  background: |
    The Wayward One is recorded as an oddity even among the Nameless: a being
    trapped between states, neither fully here nor fully elsewhere.  Scouts first
    spotted it flickering against the cavern vault, then watched it drift through
    Gravehold's defenses like a broken ghost.

    Early witness accounts describe contact as catastrophic.  In one market report,
    a merchant brushed the wisps of its floating form and began fading almost
    immediately, as if her body were being unmade into dust.  Yet the same records
    describe the creature as tormented rather than triumphant—lost, wandering, and
    seemingly driven by compulsion rather than malice.
  appearance: |
    In the card art, Wayward One rises as a vertical mass of shadow-black vapor
    veined with violet currents, like smoke trying to remember a body.  A narrow,
    jagged face with red eyes and needle teeth flashes out of the haze, then seems
    to dissolve back into it.

    Tendril-like wisps peel away from the main form and curl into the air around
    it, reinforcing a constant state of partial unraveling.  The silhouette feels
    unstable at every edge—half apparition, half predator, and never completely in
    one place for long.
  strengths: |
    The shifting positions of the Wayward One cause misaligned spells to deal
    reduced damage.  Some minions also have breach alignments.
  weaknesses: |
    The position system is both its strength and exploitable weakness—the
    predictable rotation pattern allows tactical planning.
  special_rules: |
    Uses a position tracker that rotates through I → II → III → IV → I.  Only
    spells in matching breaches deal full damage; misaligned spells deal half
    damage (rounded up).  At increased difficulty, misaligned spells deal only
    1 damage instead of half.
  story_notes: |
    Narrate Wayward One with tragic ambiguity.  Defenders fear it, but many also
    read it as a creature suffering the same "between-worlds" fracture that haunts
    breach travel itself.

    Scene tone should blend pity and urgency: flickering outlines on cave walls,
    sudden disappearances, dust where a person stood moments before, and mages
    convincing themselves that killing it may be the only compassion left to offer.
- name: Knight of Shackles
  box: The Void
  difficulty: 4
  life: 70
  battle: 1
  background: |
    Many believe the Knight of Shackles is the risen form of Thraxir, a legendary
    fallen breach mage and the bravest warrior of Gravehold who was slain by Rageborne.
    Now a skeletal commander of undead, the Knight commands an army from Gravehold's
    burial sites and uses breach magic against the mages.  He demonstrates intimate
    knowledge of Gravehold's defenses and breach mechanics, suggesting his former
    identity as a powerful mage.
  appearance: |
    An armoured skeletal knight in heavy plate armour with a prominent sword.
    The depiction is rendered in dark tones emphasizing the necromantic theme.
    Bone structures are visible within the armour, embodying the concept of the
    "risen form."
  strengths: |
    Uses a separate breach mat with four breaches.  The progressive opening of
    breaches creates escalating pressure.  Breach effects provide ongoing
    threats: distributed damage, minion revival and Gravehold damage.
  weaknesses: |
    Players can spend Aether to "unfocus" the Knight's breaches.  This provides
    counterplay and requires managing multiple threat mechanics simultaneously.
  special_rules: |
    Controls four breach tokens on a separate mat.  On Unleash, he focuses his
    closed breach with the lowest focus cost.  Opening the fourth breach leads
    to immediate game loss.
  story_notes: |
    In the narrative of The Void this skeletal commander arises from Gravehold’s burial sites, wielding shackles and commanding undead minions.  Many believe he is the risen form of Thraxir, a legendary warrior slain during the fight against Rageborne.  In a later expedition (Outcasts) the knight returns as a corrupted hero who rides a skeletal steed amid blank-faced infantry.  When the mages break through his thralls they recognise glimmers of humanity and learn from him of a fountain that collects the aether of fallen mages.  He warns them to destroy it, revealing both his lingering loyalty to humanity and the danger of tampering with the Void【980884546724550†screenshot】.
- name: Maiden of Thorns
  box: The Void
  difficulty: 4
  life: 80
  battle: 3
  background: |
    The Maiden of Thorns is a bladed horror that revels in extracting pain from
    the inhabitants of Gravehold.  She places a double-sided Thorn token on the
    cheapest supply pile; the damage she deals depends on the number of cards
    beneath this token.  The Maiden feeds on suffering and, according to Indira,
    even consumes the memories of fallen mages.  "It revels in cruelty.  There is
    no easy death to be had from this creature."
  appearance: |
    A dark, blade-like creature with thorn-like structures.  The design appears
    menacing and organic, with sharp-edged elements emphasizing its dangerous
    nature.  Razor-sharp blades protrude from its body, dripping with blood.
  strengths: |
    Uses a double-sided Thorn token on supply piles.  The token alternates
    between "Gravehold" and "Player" sides.  Deals damage based on the number
    of remaining cards in the pile plus tier bonuses.
  weaknesses: |
    Players can control which supply pile the token is on by emptying piles.
    Strategic planning around the damage is possible.
  special_rules: |
    Places a double-sided token on the cheapest supply pile.  At 2+ Nemesis
    tokens, the target suffers damage equal to the card count plus tier bonuses
    (Impale effect).  The token then moves to another pile.  On Unleash, she
    gains a Nemesis token.
- name: Bladius
  box: Aeon's End Legacy
  battle: 1
  background: |
    Bladius is recorded as a purpose-bred lieutenant of Maelstrom, engineered for
    battle rather than born to it.  Field notes describe a creature whose body is
    one continuous weapon system: blades where other beings would have hands, cutting
    ridges along limbs and armor, and movement patterns optimized for hand-to-hand
    execution in narrow tunnels.

    It does not behave like a random prowler.  Scouts repeatedly report deliberate
    search patterns through ruined shafts and old transit corridors beneath New
    Gravehold.  Why it hunts these routes remains unknown.  Some believe it is trying
    to locate and exterminate the last human pockets under Maelstrom's old command.
    Others fear Bladius is searching for something older in the deep ruins: a breach
    anchor, relic cache, or hidden passage the Nameless still need.
  appearance: |
    In the chapter art, Bladius stands amid a vortex of ochre dust and tunnel-light,
    posed like a duelist stepping into an execution.  Its frame is plated in
    slate-steel armor with razor seams at every joint, giving the impression that even
    a glancing grapple would open flesh.

    A crown of angular horns sweeps back from a helm-like skull, while narrow red eyes
    burn through the haze.  Each arm terminates in elongated stabbing blades rather
    than hands, and the fingers are shaped more like hooked puncture tools than digits.

    Its lower body is asymmetrical and massive, with one leg-like structure extending
    into a heavy segmented blade-limb built to brace, sweep, and impale in confined
    passages.  Knife-like shards hover around it in attack formation, as if the air
    itself has been turned into a rotating kill zone.
  strengths: |
    Bladius applies immediate frontline pressure through high direct damage and persistent
    threat at melee range.  Its kit rewards tempo denial: early hits, punishing attack
    windows, and constant danger that forces mages to spend resources on stabilization
    instead of pure setup.
  weaknesses: |
    Despite its lethality, Bladius is tactically straightforward.  It lacks elaborate
    scaling engines, so coordinated focus fire, timely healing, and disciplined turn
    sequencing can blunt its opening assault and collapse the fight before pressure
    compounds.
  story_notes: |
    When narrating Bladius, emphasize claustrophobia and metallic violence: sparks in
    narrow tunnels, blade-edges scraping stone, and evacuees trapped between cave-ins
    and a predator built for corridor kills.  Make its close-combat behavior feel
    intentional and drilled, as if it is carrying out lieutenant doctrine rather than
    acting on instinct.

    The emotional beat is uncertainty.  Defeating Bladius is a victory, but also a
    warning that Maelstrom's remnants are still operating with purpose beneath the
    ruins, and that the war below is not over.
- name: Deathmind
  box: Aeon's End Legacy
  battle: 4
  background: |
    Scouts and mages who survive contact with Deathmind return fragmented: names, reflexes, and practiced skills stripped away as if lifted from their thoughts.  Chapter 6 records that some recover after weeks beyond its influence, while others are permanently diminished.  Even those who can still speak struggle to describe more than a numbing psychic cold pressing through the skull.

    Brama therefore classifies any assault on Deathmind as a desperate operation.  Yet desperate operations are exactly what New Gravehold faces when critical routes and resources fall under its mental radius.  The decision to confront it is never framed as triumph, only necessity—an attempt to preserve enough minds and memory for the city to endure.
  appearance: |
    A gaunt, hairless humanoid torso curls in fetal posture at the center of a swollen exposed brain mass, suspended inside a translucent blue psychic sphere.
    Lightning-like neural filaments pulse outward from the membrane in rhythmic bursts, as if each arc is a thought being ripped free.
    Its fingers are thin and hooked, and the face is skull-like and vacant, giving the impression of an intelligence that no longer needs a body—only access to other minds.
  strengths: Uses a neural bridge to connect supply piles
  weaknesses: Vulnerable if players manage the neural bridge; once its connections
    are broken its attacks falter
  story_notes: |
    In the aftermath of the Haze Fiend assault the survivors learn that Maelstrom has awakened and that a rare ore on the surface could be used to forge weapons against it.  Scouts report that the ore is guarded by Deathmind, a Nameless whose psychic tendrils erase memories.  Led by Brama and fortified by her insights from the Fungal Mesh, the mages confront Deathmind in its lair.  Brama anchors their mental pathways and restores thoughts as the creature attempts to devour them.  They feel memories slipping away—faces of parents and voices of friends—but press on.  With Brama’s aid they overwhelm Deathmind from within, destroy its mind and collect the ore for Malastar.  Though some memories are lost forever, Brama and Mist close the breach and secure the ore, leaving the party wary of how easily a Nameless can erode identity.
- name: Fungal Mesh
  box: Aeon's End Legacy
  battle: 2
  background: 'The Fungal Mesh is a hive-mind fungus that overtook the minds of the
    first scouts to encounter it, turning them against one another and coating the cavern floor in blood.  The survivors quickly realised that this pulsating organism could seize control of anyone who inhaled its spores, forcing comrades to fight and fall.  From that day scouts kept their distance, watching the Mesh from afar and reporting its growth.  Brama at first underestimated its power, but after she herself was ensnared she vowed that the beast must be stopped if the refugees are to build a new life on the surface. '
  appearance: A carpet of luminescent fungal tendrils spreading across the cave floor.
  strengths: The Fungal Mesh spreads clinging spores that invade minds and twist perception.  Possessed scouts strike at their companions, and as the fungus feeds on aether its hive-mind influence deepens, using enthralled victims to defend itself and lure others into its grasp.
  weaknesses: Fire and concentrated bursts of magic can scorch its tendrils and burn away spores; those who resist its whisperings can break the spell over allies, and severing growth clusters weakens the collective.
  story_notes: |
    During the third wave of the Legacy expedition scouts first encounter the Fungal Mesh and are wholly unprepared for what it can do.  The aftermath is gruesome: several scouts are mentally overrun and driven to attack one another, leaving the cavern floor slick with blood.  In response, the survivors impose strict distance protocols and monitor the creature from afar, treating every spore cloud as a potential loss of control.

    Brama and Mist later leave New Gravehold to search for other survivors but are ambushed by the same mind-controlling Nameless.  The Mesh’s spores encase Brama and pull her into the hive consciousness, forcing Mist to retreat to camp wounded and plead for a rescue mission.  The party advances through fungus-choked tunnels, enduring hallucinations, psychic pressure, and sudden betrayal risks while trying to avoid possession.

    When the Fungal Mesh is finally defeated Brama is freed from its control and the breach to its realm collapses.  The mages carry her back to camp, where she recovers enough to warn that if this kind of Nameless is left unchecked no settlement on the surface will remain safe for long.  The chapter marks a turning point for the expedition: they can no longer treat mind-affecting threats as rare anomalies, and begin planning future operations around psychological resilience as much as raw combat strength.
- name: Haze Fiend
  box: Aeon's End Legacy
  battle: 3
  background: 'The Haze Fiend cloaks itself in a deadly fog that drifts through camps,
    leaving only corpses behind.  If it is not stopped the fog will move from camp
    to camp, suffocating New Gravehold. '
  appearance: An amorphous mass of fog with glowing eyes floating within.
  strengths: Uses nemesis tokens and fog cards to damage players and obscure the battlefield,
    hindering planning
  weaknesses: When its fog is dispersed it has little defence
  story_notes: |
    After rescuing Brama from the Fungal Mesh the mages enjoy only a brief respite before another menace appears.  A breach opens at the edge of their camp and a dark fog seeps out under cover of night, unnoticed until it enshrouds New Gravehold.  The poisonous haze cracks the crystals that channel aether and leaves defenders gasping for breath as a faint figure moves through the gloom, draining life from those it touches.  Survivors realise they are being hunted by the Haze Fiend and scramble to disperse the fog and protect the wounded before it can suffocate the camp or spread to other settlements.  Mist and Brama confer urgently and send scouts to investigate the disturbance as the party prepares to confront this new threat.

    The battle is chaotic and claustrophobic as the fog thickens and hides the creature’s true form.  A desperate final blow eventually fells the fiend, its scream tearing through the haze moments before the fog lifts and torches flicker back to life.  Survivors move among the fallen to search for loved ones and salvage what remains.  The mages barely prevent the fog from devouring the entire camp, and although a lone mage from the past helps turn the tide before disappearing again, debate rages afterward over whether it is ever acceptable to harness enemy breaches to protect their people.
- name: Maelstrom
  box: Aeon's End Legacy
  battle: 4
  background: 'Maelstrom is the enormous Nameless drawn to the world by Xaxos’s ill-fated
    experiment.  Its body bristles with spinning blades heavy enough to crush buildings;
    if it reaches Gravehold the last refuge will be doomed. '
  appearance: A massive centipede-like creature with whirling limbs of blades.
  strengths: Deals enormous damage and advances relentlessly toward Gravehold
  weaknesses: Slow to ramp up; if players manage early minions and focus damage they
    can defeat it before it gains momentum
  story_notes: |
    Legacy records indicate Maelstrom did not rely on brute mass alone.  It deployed
    specialized lieutenants such as Bladius into tunnel networks, using them as
    precision hunters to clear corridors, isolate mage teams, and pursue objectives
    too confined for Maelstrom's main body.

    Maelstrom manifests as a colossal orb of whirling blades ejected from the
    largest breach ever seen.  Its arrival sets the sky ablaze and hurls waves
    of minions into burning streets.  Breach mages realise they cannot slay it
    through force alone; instead they form a defensive line, cutting down
    servants while the elders channel their power against the core.  As
    Dezmodia unleashes a brilliant eruption the cavern collapses, burying
    Maelstrom under rubble and destroying Gravehold.  Though entombed, its
    presence lingers like a nightmare, reminding survivors of the cost of
    ambition.

    When it rises again years later the mages confront it on the surface, separated by swarms of minions and beacon-like constructs that threaten to open yet more breaches.  The sky above New Gravehold darkens as Maelstrom’s massive body spins and its blades slice toward the ground.  Through sheer perseverance and teamwork they finally bring the creature down.  Its shell cracks open, streaming bright light from countless fractures and revealing a twisted void at its core.  As the husk splits apart its blades plunge into the earth like monuments and its body crashes to the ground, shaking the battlefield and filling the air with debris.  When the dust clears Maelstrom is no more, but the victory is short-lived as a former ally steps forward to seize the breach’s power for himself.
- name: 'Maelstrom: Risen'
  box: Aeon's End Legacy
  battle: 4
  background: 'The mages thought Maelstrom defeated, but it had been siphoning energy
    and returns in a vengeance as Maelstrom: Risen.  Dezmodia’s sacrifice in the past
    saved them, but this time the mages must be stronger than ever. '
  appearance: A resurrected version of Maelstrom glowing with renewed power.
  strengths: 'Maelstrom: Risen uses a beacon deck and a special Assault turn order
    card'
  weaknesses: 'Although Maelstrom: Risen hits harder and adds beacons each turn, it
    is still slow to ramp up'
  special_rules: 'During setup, include two fewer upgraded basic nemesis cards in
    each tier. '
- name: Spawning Horror
  box: Aeon's End Legacy
  battle: 1
  background: |
    Chapter 3 ("In Search of New Power") identifies this Nameless as an ancient surface predator that has lain undisturbed so long it is treated as part of the landscape itself.  Scouts describe sinked mounds, ruptured stone, and a feeding basin that appears less like a lair than a malformed ecosystem grown around one sleeping will.

    Unlike most Nameless threats, Spawning Horror does not rely only on summoned allies from distant breaches.  It buds living pods from its own mass—spawn-things raised as attendants, feeders, and first-line defenders that keep the parent creature nourished while it consolidates territory.

    The chapter account warns that pod broods are only one layer of defense.  Once disturbed, Spawning Horror can still call reinforcements through the great breach above it, escalating from local infestation into a full breach-incursion if strike teams fail to contain the site quickly.
  appearance: |
    The creature is depicted as a heavy, amphibious-looking Nameless crouched in a basin of translucent green eggs or pods, its broad shoulders and long forelimbs suggesting brute leverage rather than speed.
    Its skin carries cold blue-violet iridescence, with a skull-like face, bulbous reflective eyes, and frilled cheek ridges that make it look half deep-sea carrion feeder, half cavern predator.
    One thick tail arcs behind it like a hooked scythe while one clawed hand cradles a glowing orb-pod at its chest, reinforcing the impression of a brood-guardian that both spawns and tends its own young.
  story_notes: |
    Frame Spawning Horror as an entrenched reproductive siege point.  The tactical objective is not just "kill the boss" but break the brood cycle before pod generation outpaces what defenders can clear.

    Keep scene language ecological and bodily: nest heat, membrane sheen, rupturing pods, and the constant handoff between parent and spawn.  This makes the threat feel like a living occupation of territory, not a single duel.

    In pacing, escalate in layers: first pod pressure, then mounting fear about ammunition and stamina, then the looming breach overhead as a countdown to catastrophic reinforcement.  Narration should emphasize that delay is what truly empowers this nemesis.
  strengths: Summons pods that hatch into additional minions, overwhelming the players
  weaknesses: If players kill the pods quickly the Spawning Horror remains weak
- name: 'Xaxos: Ascended'
  box: Aeon's End Legacy
  battle: 4
  background: |
    Chapter 8 records the moment New Gravehold finally names what many feared:
    Xaxos's hunger for power has overtaken him.  The mage once called friend and ally
    turns his back on the city, fixating on Nameless strength and breach manipulation
    as the only path worth pursuing.

    Time in the Void amplifies everything dangerous in that obsession.  Xaxos returns
    convinced that no living mage can match what he has learned, and that stopping him
    now is the last chance before his breachcraft becomes unanswerable.
  appearance: |
    In the card portrait, Xaxos appears as a regal but corrupted duelist in dark
    navy-and-crimson formal attire, cloak flaring as if caught in a breach-wind.
    His eyes burn red, and his expression carries both contempt and certainty.

    One arm has transformed into a black, root-like Void limb that coils into a
    clawed mass, threaded with tendril filaments and rimmed by crimson glow.  The
    contrast between courtly silhouette and living corruption reinforces the central
    horror: a brilliant human mage visibly merging with the force he sought to master.
  strengths: Can use breaches like no other, casting multiple spells per turn and
    manipulating the turn order
  weaknesses: His arrogance may be exploited; players can disrupt his breach management
    to slow him down
  special_rules: 'During setup, include three fewer upgraded basic nemesis cards in
    each tier. Use this variant to fight Xaxos: Ascended as the final nemesis of Aeon’s
    End: Legacy.'
  story_notes: |
    After Maelstrom is brought down and the survivors move to seal the last breach,
    Xaxos returns transformed by years in the Void.  Chapter framing emphasizes the
    emotional wound first: this is a former friend, and stepping into battle against
    him feels like choosing necessity over loyalty.  He reveals that he lured the giant
    Nameless to New Gravehold to siphon its power, boasting that no living mage can use
    breaches as he now can.

    Xaxos hurls bolts of shadow that dissolve everything they touch and opens swirling portals to summon hordes of minions.  His mind, once inquisitive and compassionate, is now consumed by ambition and void energy.  Reasoning and pleas fail; the mages must decide whether to destroy the man they once called friend or risk losing their home and humanity to his insatiable lust for forbidden power.

    In the climactic confrontation the mages bring him to his knees, but he refuses to yield.  As they channel their magic to close the breach he staggers forward, scorched and crackling with electricity, and attempts to draw power from the swirling void.  Brama’s voice rings out, begging him to renounce the Void and return to them, while Malastar lunges to stop him.  Xaxos snarls that he will not be helpless ever again.  A bolt of energy strikes him and a long, black tendril emerges from the breach, wrapping around his mouth and lifting him into the air.  His eyes widen with terror as the tendril drags him into the darkness and the breach seals behind him.  Sunlight shines where the abyss once hung, but the survivors are left with questions: what happened to Xaxos in the Void, and will his ambition one day bring him back?  The answers remain unknown, lingering over New Gravehold like a whisper of returning storm.
- name: Ageless Walker
  box: The New Age
  battle: 3
  background: |
    The Ageless Walker was once Karak, a devoted follower of Xaxos and close companion
    to Arachnos.  Envelope 3a records that he willingly submitted to a ritual meant to
    infuse him with Nameless strength.  He sought power to protect humanity, convinced
    the Void could be harnessed through disciplined research and stronger ritual design.

    The transformation failed catastrophically.  As Void energy flooded his body, Karak
    did not ascend—he aged in moments until only bone remained.  Arachnos heard him
    screaming but refused to halt the process, trusting his calculations over the evidence
    of collapse.  The ritual continued past death, warping the remains into a creature
    that decays and grows at once.

    Now this skeletal horror drifts through the wilds in the torn cloak of its former
    faction, strings of void residue hanging from bone and talon.  It no longer
    distinguishes friend from enemy; it kills indiscriminately, as if the last trace
    of Karak’s identity was consumed when the ritual crossed its final threshold.
  appearance: |
    In the card art, Ageless Walker looms as a bone-white humanoid carcass threaded
    together with black, tendon-like void cords.  A hollow skull mask with empty
    sockets dominates the upper body, while jagged antler-like bone spurs arc from
    its shoulders and back like a collapsing crown.

    Multiple elongated arms radiate around the torso, each ending in hooked, skeletal
    claws posed as if grasping for prey on all sides at once.  The figure appears
    both assembled and unraveling: limbs cinched by dark bindings, joints pulled out
    of human proportion, and robes hanging in strips beneath a frame that looks more
    like a ritual marionette than a living creature.
  strengths: Drains life and ages everything around it, causing vegetation and flesh to wither.  Its touch can kill followers and enemies alike, and its presence brings decay and despair.
  weaknesses: The ritual that sustains it leaves it brittle; severing its connection to the Void or confronting it with memories of its past life may weaken its resolve and slow its relentless decay.
  story_notes: |
    Narrate Ageless Walker as a cautionary tragedy before it is framed as a monster.
    Karak volunteered, trusted his mentors, and believed he was sacrificing for a future
    where humanity could survive by mastering enemy power.  That belief makes the fall
    more painful than a simple accident.

    Keep the moral wound visible: Arachnos heard the screams and chose not to stop the
    ritual.  In scenes tied to exile-era politics, this detail should sharpen distrust
    toward "necessary" experiments and expose the cost of treating people as test
    thresholds.

    The encounter atmosphere should feel like accelerated ruin—plants blackening at the
    edges, tools rusting in hand, skin tightening with sudden age, and a creature that
    moves like a body pulled by conflicting timelines.  Survivors should leave with
    victory and dread in equal measure: if one willing volunteer became this, what other
    failures were left in the wild.
- name: Fenrix
  box: The New Age
  battle: 4
  background: |
    Fenrix was born of Arachnos’s exile experiments to infuse a living wolf with Void energy.  In his journals he writes that earlier trials collapsed when the breach seal failed mid-ritual, trapping a rabbit in the Void and forcing him to redesign the runes to withstand a greater energetic strain.  Convinced a larger host would adapt better, he fed the captured wolf with Void essence and waited for evolution to take hold.  The creature that emerged was no longer a mere animal: six glowing eyes peer through swirling snow and its mind-shattering howl freezes the blood of any who hear it.

    It prowls the wilds like a force of nature, conjuring blizzards where no snow should fall and leaving paw prints as wide as a mage’s arm embedded in the soil.  Survivors speak of a gentle snowflake landing on a cheek, a sudden gale turning sunlit woods into a whiteout, and a shadow with six eyes emerging from the storm to claim its prey.  Fenrix embodies both the land’s volatility and the catastrophic hubris behind the exile research: proof that the Void can be made to inhabit flesh, but never safely controlled.
  appearance: A hulking, moonlit wolf with six crimson eyes clustered in its skull, a mane of spine-like quills along its neck and shoulders, and dark horn-like growths curling from its crown.  Its pale fur is streaked with shadow and frost, its jaws drip frozen saliva, and each step drives oversized claws into the snow as if the mountain itself were being carved open.
  strengths: Conjures unexpected blizzards and uses keen senses to stalk prey in whiteout conditions.  Its frozen howl paralyses and disorients those who hear it, and it moves through the storm with predatory grace.
  weaknesses: The unnatural cold it conjures is unstable; luring Fenrix away from its storm or disrupting its concentration can weaken it and expose its vulnerable form.
  story_notes: |
    The account attached to Fenrix traces directly to Arachnos’s exile journals (Envelope 4).  He describes testing ritual runes, losing an earlier animal subject when the breach collapsed, then escalating to a live wolf after adjusting the ritual to channel greater Void output.  His tone is clinical and triumphant, culminating in his stated intent to begin human experimentation if the wolf survived.  Fenrix therefore represents more than a beast encounter: it is a surviving artifact of a deliberate, unethical research program.

    In narration, frame Fenrix as the living consequence of curiosity without restraint.  The storm should feel less like weather and more like ritual fallout still radiating from the creature’s body.  Emphasize dread through environmental cues—unnatural cold fronts, sudden silence in woodland terrain, and the sensation that the hunt begins before the beast is visible.  Where useful, connect Fenrix to wider New Age themes: exile science, Void adaptation, and the escalating risk that failed experiments become self-sustaining threats.
- name: Maggoth
  box: The New Age
  battle: 1
  background: |
    Maggoth is a massive insectoid horror birthed from the last broodwomb of the Carapace Queen.  After the broodwomb resurfaced, a renegade mage nurtured it with breach energy until it emerged as a colossal creature.  Maggoth lurks in swamps and marshlands near New Gravehold, bursting from undergrowth with a carapace streaked in void sludge.  Its segmented body and chittering mandibles are accompanied by a swarm of smaller broodlings it controls with unnerving coordination.  Witnesses note that the creature seems almost guided by a human intellect as it flanks, divides and overwhelms its foes.  These swarms spread through the wetlands like a plague, threatening to overrun settlements if left unchecked.
  appearance: A towering beetle-like monstrosity with glistening husks, dripping void slime and ovipositor segments that spawn waves of smaller insects.
  strengths: Commands swarms of insectoid minions and spreads brood pods throughout the swamp, using terrain and numbers to overwhelm settlements.  Its hive mind allows unexpected coordination among its creatures.
  weaknesses: Its brood pods and egg sacs are vulnerable before they hatch; destroying them early can halt the swarm’s growth and weaken Maggoth’s influence.
- name: The Wailing
  box: Shattered Dreams
  battle: 3
  background: |
    Sahala's field account places The Wailing within a longer arc of collapse and
    recurrence.  Deep in the forest, patrols still find jade-preserved victims from
    ancient wars against the Blight Lord—faces locked in agony, bodies turned into
    monuments of failed defense.  Those ruins are not relics alone; they are warnings.

    New reports describe a second wave of petrification through blue onyx: trees
    encased in dark-veined crystal and victims infected by the Wailing's scream.
    The onyx incubates in living veins, then erupts through skin and slows movement
    until life stops entirely.  To Sahala, this is history repeating with a new
    mineral mask, and New Gravehold may be standing at the start of another cycle.
  appearance: |
    In the card art, The Wailing descends as a winged, batlike Nameless with a lean
    humanoid torso and an oversized jaw lined with needle teeth.  Its hide is red and
    sinewed, but the head and shoulders are crusted with jagged blue crystal growths
    that glow against ember-lit skies.

    Wide membrane wings frame the figure while blue shards spray outward as if shed
    mid-flight.  The combination of predatory anatomy and mineral overgrowth makes it
    appear both creature and contagion—an airborne vector for the onyx plague.
  strengths: Inflicts Cracked Onyx cards on players; these clog their decks and cause
    them to gradually petrify
  weaknesses: If the onyx cards are managed and removed, the Wailing’s effect dwindles
  story_notes: |
    Narrate The Wailing as epidemic horror, not just a boss encounter.  The scream is
    both weapon and transmission event, and every frozen victim should read as a
    timeline marker in a spreading outbreak.

    Keep Sahala's perspective active: grief tied to historical memory, fear that
    civilizations repeat old errors, and urgency to contain the infection before blue
    onyx reaches dense population routes around New Gravehold.
- name: The Wanderer
  box: The Ancients
  battle: 3
  background: |
    Brama frames The Wanderer through the long cycle of loss: the World That Was fell,
    Gravehold fell, and any honest defender knows New Gravehold may someday face the same
    fate.  Her concern is not only survival in the present, but whether memory can carry
    enough truth forward to change the pattern.

    After scouts reported a wavering Nameless, Brama and Mazra searched surviving
    archives and found a likely connection to an older foe, the Wayward One.  The records
    suggest recurring traits across eras: inconsistent physical form, unstable presence,
    and unusual resistance to direct force.  Brama's conclusion is cautious but resolute:
    if this is a recurrence, then past victories are precedent—not guarantee.
  appearance: |
    In the card art, The Wanderer appears as an airy, storm-charged figure suspended
    above jagged mountains, its body formed from pale liquid-white currents and violet
    haze rather than solid flesh.

    Dark orb-like nodes orbit around the torso and link through crackling arcs, while
    elongated, antler-like projections crown a narrow upper silhouette.  The lower form
    trails into sweeping, wave-like ribbons that blur the boundary between creature,
    weather, and breach phenomenon.
  strengths: Reduces all damage from player abilities and cards to 1; players must
    spend aether to deal additional damage
  weaknesses: Spending aether can overcome its dampening pylons
  story_notes: |
    Narrate The Wanderer as a historical echo made present.  Brama's archive-work should
    matter in-scene: elders cross-checking old records, scouts debating resemblance, and
    mages trying to decide whether they are fighting a new threat or a recurring one.

    Tone should balance fatalism and defiance.  The recurrence theme invites dread, but
    the emotional payoff is collective continuity—people who remember, adapt, and refuse
    to surrender history to repetition.
- name: Necroswarm
  box: Into the Wild
  battle: 4
  background: |
    Necroswarm was once a peaceful creature that roamed far from human settlements, a living amalgam of vines and roots that nurtured the forest and even raised one young mage as its own.  Its corruption began when a traitorous breach mage used glowing glyphs to siphon its energy and drive it north.  Twisted by unstable Void pus and compelled by runes, Necroswarm’s family of brambles turned into an invading army.  To Inco it still feels like home; to New Gravehold it is a symbol of betrayal, showing how easily compassion can be weaponised.
  appearance: |
    A colossal bull shaped from vines and thorny branches, covered in brambles that ooze sickly green pus.  Six luminous eyes stare out from a face woven of leaves and bark.  Around its hooves swarm living bramble minions—twisted shrubs infused with void energy—that detonate in explosions of green mist and decay.  Its hide rustles with insects and the scent of sap and rot.
  strengths: |
    Necroswarm commands an ever-growing army of bramble creatures.  It marches toward settlements leaving scars of rot, and its bramble minions explode when struck, showering the battlefield with corrosive spores.  Glyph beacons allow it to siphon breach energy and regenerate its forces, and its massive size lets it trample defences while calling vines to bind its foes.
  weaknesses: |
    The creature’s actions are controlled by glyphs and a traitor’s influence; destroying or cleansing these runes can weaken the bramble army and free Necroswarm from its compulsion.  It responds to Inco’s pleas, hinting at a memory of its peaceful life.  Bramble minions are vulnerable to fire and can be cleared before they reach vital structures, and the unstable green pus that infuses them can backfire when ignited.
- name: Burrower
  box: Return to Gravehold
  battle: 4
  background: |
    Cairna says she felt the Burrower long before she saw it: vibrations traveling
    through tunnel stone and a constant warning underfoot that stable ground could
    become a pit in a single breath.  In her account, living below Gravehold means
    learning to mistrust silence, because this Nameless turns careful routes into
    sudden collapses and stone into quicksand.

    She glimpsed it only once—a huge body with claws as tall as she is—gliding through
    rock as if swimming water and ripping bedrock like paper.  The Burrower attacks
    both footing and logistics, shredding supply tops while forcing mages to navigate
    a battlefield that keeps changing beneath them.
  appearance: |
    A colossal burrowing Nameless with a pale, muscular bulk and a crown of red,
    tentacle-like feeding tendrils surrounding a vertical maw.
    Small clustered eyes and scarred hide suggest a creature evolved for darkness,
    while foreclaws the height of a person anchor it as it tears through tunnel walls.
    In battle scenes it appears half-emerged from collapsed masonry, making every
    broken floor or cracked arch feel like the start of another ambush.
  strengths: Destroys the top card of supply piles and seeds hidden trap pressure in
    the market, turning routine purchases into sudden hazards while battlefield footing
    keeps collapsing around the mages
  weaknesses: Has no persistent minion screen; coordinated damage and careful trap
    management can blunt its attrition plan and force it into a direct confrontation
  story_notes: |
    Cairna warns that facing Burrower is as much a navigation battle as a combat one.
    In her account, whole corridors that seemed solid one breath earlier sank away in
    the next, and she caught only brief glimpses of a huge body gliding under stone.
    By the time mages identify where it will surface, new pits have already cut off
    retreat routes and split the line.

    The creature's ambush rhythm is relentless: collapse the terrain, shred supplies,
    then vanish before a full counterattack lands.  Survivors learned to move in tight
    coordination, probe every approach, and keep fallback routes open at all times.
    Against Burrower, overextension is punished immediately and often fatally.
- name: Fortress
  box: Return to Gravehold
  battle: 3
  background: |
    Fortress lurks beneath the flooded ruins of Old Gravehold.  Gygar first approached the site expecting relics and sunken treasure, only to discover that the "wreckage" was alive: a gigantic aquatic Nameless wearing the city itself as armour.  From above, its shell appears to be nothing more than collapsed districts piled in the chasm.  At close range the rubble rises, shifts, and towers over intruders as the creature drags whole slabs of broken Gravehold across the waterlogged ground.

    More than brute force, Fortress is a study in adaptation.  It integrates stone, brick, and fractured infrastructure into a mobile citadel, turning New Gravehold's past into a weapon against its defenders.  Bringing it down is not only a tactical necessity but also a chance to understand how Nameless anchor themselves to hostile environments and convert terrain into living fortification.
  appearance: |
    A colossal crustacean-like Nameless whose true body is mostly hidden beneath fused city debris.  Its shell resembles a moving district of shattered towers and broken walls, while two massive claws jut out like siege rams from under the rubble mantle.

    In battle, the creature reads less like an animal and more like a crawling ruin: masonry grinding, water surging around its frame, and old Gravehold stone locking into place as if the city is rebuilding itself around a monster.
  strengths: |
    Fortress constantly reinforces itself by advancing on a dedicated Fortress Track and accumulating rubble tokens, making it progressively harder to break through.  If left unchecked, its armour scaling outpaces normal damage plans and forces mages into a long attrition fight.

    Its claw strikes and shifting bulk punish hesitation, but its most dangerous trait is tempo pressure: every step forward not only threatens direct harm, it also thickens the shell and narrows the window for an efficient kill.
  weaknesses: |
    Fortress depends on its rubble engine.  Teams that repeatedly strip rubble, interrupt its forward momentum, and time concentrated bursts of damage can prevent the shell from reaching unmanageable levels.

    Once the outer fortification is peeled back, the Nemesis is far less secure than it appears.  Coordinated pressure that targets both defence scaling and core health can collapse the entire "living citadel" before it overwhelms the line.
  story_notes: |
    Narratively, Fortress should feel like fighting the ruins of Old Gravehold itself.  Gygar's account sets the tone: awe at the discovery, immediate terror when the rubble stands up, and grim fascination that a Nameless could repurpose a dead city so completely.

    Emphasize the dread of seeing familiar stonework used as enemy armour.  The mages are not only defending the present settlement, they are confronting the remains of what was lost—and trying to reclaim those ruins from a creature that has made them part of its body.
- name: The Burning Kor
  box: Southern Village
  battle: 4
  background: |
    Kel's field account frames the Burning Kor as a consequence of surface expansion
    gone wrong.  Since New Gravehold spread farms, patrols, and outposts across open
    land, Azer's sigil-bound communities have seen Portalborn routes bend south into
    their forests.  The Kor is the most catastrophic result: a humanoid Nameless made
    entirely of flame that turns woodland shelter into an advancing burn zone.

    To Azer, the threat is existential on two fronts.  The creature itself is lethal,
    but the inferno in its wake can be just as deadly, erasing food cover, evacuation
    paths, and defensive terrain faster than scouts can redraw maps.
  appearance: |
    The Burning Kor appears as a towering humanoid silhouette made entirely of
    incandescent fire, as if a giant figure were sculpted from molten sunlight.
    Its upper body is framed by streaming flame that resembles wind-whipped hair,
    and its face reads as a pale, skull-like mask suspended inside the blaze.

    In the illustration, bright circular bands of white-gold fire hover around its
    wrists like ritual sigils, while ember-laden arms reach outward from a core of
    churning yellow-orange heat.  Wherever those flames touch ground, root-like veins
    of heat spread and ignite the terrain around it.
  strengths: |
    The Burning Kor projects advancing ember pressure through its movement system.
    Ember tokens accumulate and march toward vulnerable spaces; when they arrive,
    they detonate in bursts that can heavily damage both Gravehold and the mages.
    This constant forward pressure punishes slow setups and forces players to split
    attention between direct attacks and fire containment.
  weaknesses: |
    Its ember chain can be disrupted before it reaches catastrophic thresholds.
    Teams that prioritize ember removal, coordinate movement-mat control, and time
    their damage bursts can blunt the Kor's momentum and prevent the largest fire
    eruptions from ever triggering.
  story_notes: |
    Kel contrasts Azer's restraint with New Gravehold's expansionist habits: her people
    minimize open breaches and avoid conspicuous magic, while surface settlements
    unintentionally push threats into neighboring biomes.  This perspective adds
    political tension to Burning Kor narratives without reducing the immediate urgency.

    In scene terms, the battle should feel like triage under apocalyptic heat.  Mages
    must split focus between engaging a walking inferno and preserving the living
    forest systems that keep Azer viable after the fight.
- name: Experiment 153
  box: Outcasts
  battle: 1
  background: |
    Experiment 153 was once a simple rabbit used in Arachnos’s exile research.  According to Tagren’s recovered account, the animal was accidentally abandoned in the Void when an earlier breach experiment failed; months of exposure twisted it into a predatory aberration obsessed with consuming aether.

    The discovery comes after Fenrix and Arachnos are defeated, when fragments of the journals reveal that the same chain of experiments produced multiple living catastrophes.  Tagren frames the creature as tragic evidence of the Void’s corruptive nature: power that promises advancement but repeatedly mutates, blackens, and destroys what it touches.
  appearance: |
    A sinewy, rabbit-shaped horror with pallid gray skin stretched tight over elongated limbs, red eyes, and a jaw lined with needle-like teeth.
    Petal-like void membranes fan from its back like torn wings, while sparse white fur clings in ragged patches along its arms, spine, and haunches.
    It crouches low before explosive leaps, its foreclaws hooked and overgrown, giving the impression of a frightened prey animal remade into a starving ambush predator.
  strengths: Uses maw tokens that represent its insatiable hunger
  weaknesses: Maw tokens can be managed early to prevent exponential growth
  story_notes: |
    As the Outcasts expedition begins, Experiment 153 erupts near a vulnerable settlement and forces a rushed defence with too few mages in position.  Its attack sets the tone for the journey: old experiments and Void-tainted creations are no longer distant rumors but immediate threats.

    Survivors describe the encounter as chaotic and close-range, with the creature's unpredictable lunges breaking formation and forcing the group to improvise.  Defeating it becomes less a clean victory than a warning of what waits farther from New Gravehold.
- name: Fountain of Souls
  box: Outcasts
  battle: 4
  background: |
    While mapping paths through the Void, Xaxos discovered what looked like a vast reservoir of pure aether: a radiant fountain shimmering like salvation in a dead world.  Curiosity drew him close, and only later did he realize the "fountain" was alive.  It was not collecting energy passively—it was feeding.

    The Fountain of Souls absorbs aether from breaches and mages alike, trapping fragments of consciousness inside floating bubbles of light.  From a distance it appears beautiful and almost holy; up close, the suspended forms within reveal its true nature.  It tempts the desperate with the promise of restoration, then drains and binds whatever comes near.
  appearance: A shifting, translucent column of Aether with faces trapped within the
    flowing energy.
  strengths: Uses a souls track; as the track fills, it unleashes powerful attacks
    and drains Aether from players
  weaknesses: Players can remove souls from the track through card effects
  story_notes: |
    Xaxos describes the moment of recognition as horror layered over wonder: what first seemed like a miracle in the Void was a predatory entity wearing the shape of hope.  He observed it from afar, testing how it reacted to breach surges, until a fresh wave of aether was swallowed and the trapped "bubbles" became unmistakable—souls suspended inside the creature.

    In narration, the encounter should feel like a moral trap as much as a battle.  The Fountain offers exactly what grieving survivors want to believe: that the dead can be reached and returned.  The mages must resist that pull, disrupt the soul cycle, and destroy the source before New Gravehold loses more lives to a beautiful lie.
- name: Risen Thrall
  box: Outcasts
  battle: 3
  background: 'While battling the Knight of Shackles, Z’hana (Outcasts) fought alongside
    thralls.  Now she encounters a follower of the Knight leading its own army of
    thralls.  Z’hana fears that even if a Nemesis is defeated its servants may return
    and wonders whether thralls can become Nameless themselves. '
  appearance: A skeletal soldier wearing tattered armor, surrounded by thrall minions.
  strengths: Summons numerous thrall minions and gains bonuses when minions die
  weaknesses: Minions have low health and can be cleared before they overwhelm the
    players
  story_notes: |
    The Risen Thrall embodies a grim Outcasts lesson: defeating a master does not end the danger when devoted servants remain.  As the expedition advances, undead ranks rise to block every route and buy time for greater horrors.

    In the encounter, the Thrall's pressure comes from numbers and persistence.  The mages must carve through repeated waves without losing tempo, knowing that delay lets the wider host consolidate around them.
- name: Thief of Dreams
  box: Outcasts
  battle: 2
  background: |
    In Envelope 2a accounts from Ilya and Kel, the Thief of Dreams is described as
    less a beast than a wound in reality: a negative-space presence that seems to
    pull focus, breath, and certainty out of the air around it.  Even seasoned
    Portalborn trackers struggle to classify it, because the thing behaves like
    atmosphere given hunger.

    The expedition records a persistent cognitive effect around the creature.  Mist
    from its body blurs landmarks, weakens spell concentration, and leaves mages
    doubting sensory input they would normally trust.  Kel's warning is blunt—if
    even stars feel unreliable in this region, then the Thief's battlefield is not
    terrain but perception itself.
  appearance: |
    In the card art, Thief of Dreams appears as a horned, humanoid void-silhouette
    standing against vivid rose-and-teal cavern light.  Its body is mostly shadow,
    but pinpricks of starlike color glimmer through the torso as if night sky were
    trapped beneath skin.

    Curled ram-like horns crown a narrow head, and long, clawed hands extend from
    ragged edges of smoke-dark form.  The outline constantly frays into vapor,
    suggesting a creature that is never fully present and may be partly composed of
    dream residue rather than flesh.
  strengths: Uses a dream deck that fills players’ hands with strange dreams and misfires
    spells
  weaknesses: Proper management of the dream cards can limit its impact
  story_notes: |
    Crossing the Void requires constant concentration, and the Thief of Dreams attacks
    that discipline directly.  It drifts above the expedition like living fog,
    drawing out fears and fractured memories until even practiced mages hesitate over
    simple spellwork.

    Narratively, this fight should feel disorienting rather than explosive: whispered
    temptations, distorted landmarks, and moments where allies seem to vanish in mist.
    Use Ilya and Kel's testimony to keep tone grounded—curiosity curdling into dread
    as focus becomes physically difficult.

    Survival in these scenes should read as collective cognition management:
    call-and-response checks, repeated spell mnemonics, and deliberate grounding
    rituals so no one mage is left alone inside the Thief's haze.
- name: Bishop of Scrolls
  box: Legacy of Gravehold
  difficulty: 2
  life: 50
  battle: 1
  background: |
    The Bishop of Scrolls frames himself as historian, judge, and prophet of collapse.
    His signature tale recounts the first Gravehold: a people who fled underground,
    grew secure behind stone, and eventually forgot the fear that once kept them alive.
    In his retelling, complacency and forbidden void experiments invited catastrophe,
    culminating in the summoning of a colossal Nameless into the heart of the city.

    He tells this story like a parable with a lesson for every listener: patrol farther,
    question less, and obey the custodians of doctrine.  The implication is always that
    discontent, curiosity, and innovation are contagions that must be cut out before
    they can fracture the city from within.

    The Bishop's warning is never neutral.  He weaponizes history to control the present,
    insisting that safety breeds weakness and that only strict doctrine can prevent a new
    Fall.  Facing him feels less like battling a brute and more like resisting a regime
    of stories that punishes dissent as heresy.
  appearance: |
    In the illustration, Bishop of Scrolls appears as a ceremonial figure in layered
    red-and-gold robes over polished bronze armor, with a geometric, visor-like helm
    hiding all facial features.  Thick cords and ringed ornaments hang from the mask and
    shoulders, giving him the silhouette of a ritual magistrate rather than a front-line
    warlord.

    A floating tome opens beside his hand, its pages lit by pale blue aether and marked
    with glowing eye sigils.  Curled sheets of luminous script drift through the air like
    commanded spirits, reinforcing that his power is expressed through written will and
    imposed meaning.
  strengths: |
    The Bishop generates relentless board pressure through the unnamed deck.  His Unleash
    cadence can place multiple unnamed minions into play and immediately resolve their
    effects, creating stacked threat bursts that rapidly destabilize turns and punish slow
    setups.
  weaknesses: |
    His engine depends on unnamed presence.  Fast minion control, coordinated burst damage,
    and careful sequencing to prevent immediate-effect chains can contain his momentum.
    When the unnamed board is cleared decisively, the Bishop's pressure drops sharply.
  special_rules: |
    At setup, place unnamed minions into play according to the encounter setup (Legacy and
    non-Legacy differ).  Unleash: Draw a card from the unnamed deck, place an unnamed into
    play, and resolve its "IMMEDIATELY:" effect.  Then place another unnamed into play and
    resolve its "IMMEDIATELY:" effect.  In a 1/2/3-player game, place and resolve a third
    unnamed.

    At increased difficulty, each unnamed comes into play with 2 additional life.
  story_notes: |
    Narrate Bishop of Scrolls as a charismatic architect of collective memory.  He does not
    simply attack bodies; he curates fear, selects which histories are repeated, and uses
    those histories to justify escalating control.

    The emotional throughline should be uneasy familiarity: his robes, proclamations, and
    book-laden sorcery feel almost civilized—until players realize they are fighting a
    doctrine that turns people into footnotes.

    Keep his claims about the Fall and the "largest Nameless" intentionally contested in
    tone.  He speaks as if his version is objective truth, while other records (including
    accounts tied to Xaxos and Maelstrom) suggest a more complicated chain of mistakes,
    ambition, and shared responsibility.
- name: Brama (Legacy of Gravehold)
  box: Legacy of Gravehold
  battle: 2
  background: 'Brama insists she has guided the city longer than any other.  She taught
    the sister-words, built the walls and shelters, and reminds young mages that their
    magic arose from desperation not pleasure.  Refusing to let her work crumble or
    lose more family, she now stands as a nemesis to protect the old ways at any cost. '
  appearance: An elderly woman wielding binding runes, her eyes aflame with righteous
    fury.
  strengths: Prevents players from gaining charges or healing; uses mentor tokens
    that punish mages for using advanced spells
  weaknesses: Has low life compared to other Legacy nemeses

# Gate Witch (Legacy of Gravehold)
- name: Gate Witch
  box: Legacy of Gravehold
  battle: 4
  background: |
    Yan Magda, Brama and Phaedraxa speak of a ragged visage glimpsed in the depths of the
    Void that they call the Gate Witch.  It is said that the infinite is this witch’s
    dominion—she bends and breaks time itself.  To Brama, time flows like water, and
    human lives are drops of blood in a vast confluence; to Phaedraxa, the end is written
    in the ashes of the beginning.  Indira, a breach apprentice, has seen the malice of
    time first-hand and warns that future and past are smeared together across the Gate
    Witch’s maw.  As the bells of New Gravehold toll and burnt breach air scorches
    her face, she fears that each encounter with this entity may herald the last battle.
    The Gate Witch embodies the relentless advance of time and the inevitability of
    decay; it manipulates the flow of events, accelerating the arrival of doom and
    blurring the distinction between beginnings and endings.
  appearance: A hulking void creature with slick green skin and elongated limbs, emerging
    through a swirling yellow gate.  Its face is twisted with gaping jaws and
    multiple eyes, and its clawed hands reach out as if to tear the fabric of time.
  strengths: Manipulates the passage of time, accelerating the appearance of threats
    and turning the battlefield into a whirl of simultaneous events.  Its presence
    warps breaches and seems to summon horrors faster than mages can prepare.
  weaknesses: If mages can stabilise the flow of time and disrupt its acceleration,
    the Gate Witch’s control wanes and its assaults become predictable.
- name: Fate Shepherd
  box: Legacy of Gravehold
  difficulty: 3
  life: 70
  battle: 1
  background: |
    During one of his Void excursions, the Bishop of Scrolls records an encounter with a Nameless unlike the usual ravening horrors.  His Envelope 5 account describes Fate Shepherd as curious and observant, a creature that studies relics rather than merely smashing them.  Where most Nameless seem incapable of understanding crafted magic, this one appears to recognize the relationship between human aether-work and Void resonance.

    The Bishop concludes that Fate Shepherd can interfere directly with those channels, pulling force through gems, weapons, and spells before hurling that power back at its owners.  In his words, if more Nameless learned this behavior, the war would become far more difficult for Gravehold to survive.  Rather than destroy it, he marks Fate Shepherd as a creature to cultivate—an integral instrument for turning the mages’ own tools into liabilities.
  appearance: |
    A vast, raven-like Nameless spreads broad midnight-blue wings against a pale moonlit sky, each feather edged with cold highlights.
    Its head narrows into a long hooked beak marked with clusters of small crimson eyes, while black talons curl like ritual knives at the tips of its raised limbs.
    Gold bands and angular red gemstones are fastened at its throat and joints, and a gem-set harness with trailing crimson cloth hangs across its torso, giving it the silhouette of a predatory war-priest draped in relic armor.
  strengths: |
    Fate Shepherd's greatest weapon is its understanding of relics and aether.
    It can seize control of magical objects and spells, redirecting the power back toward the mages who cast them.
    By exploiting the link between Void magic and human magic it manipulates opponents' tools against them and grows stronger from the chaos it creates.
  weaknesses: |
    The creature's power depends on the presence of relics and spells to twist; if mages deprive it of enchanted equipment or focus on simple attacks that cannot be reversed, its influence wanes.
    Disrupting its control over aether and severing the bond between its mind and stolen magic prevents it from weaponising their own arsenal.
  special_rules: |
    Unleash: Any player gains a card from the supply.  That player or Gravehold
    suffers damage equal to the cost of that card minus 1.  At increased
    difficulty, the cheapest supply card is destroyed after each Unleash.
- name: Stonemonger
  box: Past and Future
  battle: 2
  background: |
    Brama's Past 2a testimony places the Stonemonger at the heart of the old Calamity's first wave: elders describe an "invisible eruption" that broke outward like a tsunami, and everything it touched changed in moments.

    In one account, a market in Port Hanon became the proof point.  Merchants and patrons were overtaken mid-bargain, flesh and thought stripped away as corruption rolled through the stalls.  Survivors remembered blood on gem tables, teeth on stone, and familiar faces hollowed into ravenous masks before anyone could flee.

    The Stonemonger is treated as one of those catalytic Nameless—an agent that does not merely kill, but converts social space into contagion terrain.  Where it roots itself, trade routes collapse, trust fractures, and communities begin to turn on one another out of panic before the creature ever reaches the walls.
  appearance: |
    The Stonemonger resembles a bulky, half-humanoid scavenger with bark-dark, mottled skin stretched over swollen muscle and long forelimbs that end in hooked, bony claws.
    Its mouth glows ember-orange from within, as if heat or aether burns down its throat, while clustered nodules across its skull and shoulders give it a blighted, fungal silhouette.
    In the card art it hunches around a nest of bright crystals, one clawed hand spread protectively over the cache as purple-black tendrils and rootlike strands drape around it like living snares.
  story_notes: |
    Use Stonemonger scenes to show corruption as a civic disaster, not only a combat threat.  Its arrival should read like a market, caravan lane, or minehead becoming unusable in minutes as fear spreads faster than orders.

    Anchor narration in tactile details from Brama's memory-chain: gem dust in blood, shattered stalls, and witnesses struggling to reconcile the monster with the person they knew moments earlier.  This keeps the threat grounded in communal grief rather than abstract apocalypse.

    Portray the creature as possessive and resource-driven.  It hoards crystal seams and supply stockpiles, lashes out at retrieval teams, and turns every attempted salvage operation into a moral choice between rescuing survivors and preserving scarce aether.
  strengths: Generates corruption tokens that spread across supply piles, making cards
    more expensive and painful to acquire
  weaknesses: Players can cleanse corruption by destroying certain cards
- name: Herald of the End
  box: Past and Future
  battle: 2
  background: |
    In Xaxos’s exile journal, he describes the Herald of the End as composed of five
    dragon-like creatures, each similar in size and appearance, fused together so
    closely that it is difficult to see where one razor-sharp tail ends and the next
    spiked muzzle begins.  He questions how Brama once drew distinctions between
    Nameless leaders and followers and wonders whether these heads might be brothers.
    His reflections lead him to consider whether Nameless have families and how they
    propagate so rapidly.  The creature’s form and his guilt over what he has done
    blur his notions of hero and monster.
  appearance: A swirling mass of five intertwined serpentine bodies, each ending in a
    dragon head with spiked muzzles and different colours.
  strengths: Coordinates multiple heads for devastating attacks; when one head is
    harmed, the remaining heads grow more ferocious
  weaknesses: Isolating and eliminating individual heads disrupts its coordination
    and reduces its overall threat
  story_notes: |
    In his journal Xaxos notes that the Herald of the End defies simple categories of
    Nameless.  It is composed of five dragon-like entities bonded so closely that
    leader and follower become indistinguishable.  He wonders if these heads are
    brothers and if Nameless have families or feel grief.  He ponders how such
    creatures can propagate so quickly that they constantly besiege New Gravehold.
    Xaxos admits that after the fall of Gravehold he has little desire to draw
    distinctions between monsters and mages; he wonders whether he or the creature
    is the true monster, reflecting that he has not yet wept for Dezmodia.
- name: Erythiza, Consumed
  box: Past and Future
  battle: 4
  background: |
    Brama’s Past 4 account frames Erythiza as the central mystery of the Calamity: one day a thriving city of scientists and innovators, the next swallowed into the air and overrun by corruption.  Survivors describe citizens transforming from human to Nameless in moments while violet-black growths webbed streets, towers, and breachworks.

    When mages reached the epicenter, they concluded that the concentration was too dense to cleanse conventionally.  A coalition led by Willow and Kavoc opened an immense breach and forced the city-scale corruption mass out of the world entirely.  Erythiza itself disappeared, leaving only an empty field and unanswered questions about what happened within the vanished city and who first contained the spread.
  appearance: |
    The ruins manifest as a golden cityscape strangled by dense violet tendrils and smoke-like corruption webs stretched between windows, rooftops, and broken arches.
    Emaciated, half-transformed Nameless figures stalk the streets—long-limbed, hollow-chested silhouettes that look like people drained to wire and bone.
    Instead of one singular monster, Erythiza, Consumed appears as an urban infection front: architecture, air, and bodies all fused into a single advancing corruption field.
  strengths: Uses corruption tokens and twisting tendrils that drain life and infect
    players with decay; the storm expands relentlessly
  weaknesses: Destroying tendrils reduces its power; vulnerable to being pushed through
    a massive breach into extra-dimensional space
- name: The Endless Decay
  box: Origins
  battle: 3
  background: |
    In Kiri Maesan’s field account, corruption among animals is usually contained by a harsh natural cycle: phoenixes and surviving wildlife cull infected creatures before they can mature into true Nameless.  Most outbreaks end quickly, either hunted down as threats or driven off as prey gone wrong.

    The Endless Decay is what happens when one corruption-vector slips through that net long enough to evolve.  It is no longer simply a sick beast but a full Nameless engine of deterioration, spreading entropy through any ecosystem it enters and proving Kiri’s warning that even nature’s balancing systems can fail.
  appearance: |
    A giant, spider-like predator with a polished amber-gold carapace and long, needle-jointed legs that move with precise, mechanical rhythm.
    Its body is segmented into bulbous armored nodes, and each step leaves a sense of structural collapse, as though matter around it is aging and thinning in real time.
    Behind it, green-black spectral residue coils through the air like evaporating venom, framing the creature as less a scavenger and more a walking vector of environmental ruin.
  strengths: Inflicts decay counters on players’ decks, turning cards into useless
    husks
  weaknesses: Players can purge decay by destroying decayed cards or using phoenix-related
    relics
- name: Clouded Mesmer
  box: Evolution
  battle: 4
  background: |
    Dorian, Magic Theorist, argues that Clouded Mesmer is proof the Nameless can
    study human magic rather than merely rage against it.  In his field account,
    the creature's smoke enters a victim's mind and manufactures urgent desires for
    things they never wanted, then exploits those desires with surgical precision.

    He describes the resulting compulsion as a bodily tyranny: even mages who hate
    obedience feel an internal weight dragging them forward like puppets, with
    disobedience punished by agonizing pressure "from the inside out."  Dorian's
    conclusion is blunt—no one should face this Nameless alone.
  appearance: |
    A towering void-figure composed of layered black and blue smoke, with ember-orange
    eyes burning above a torso cinched by self-binding tendrils.
    At its center hangs a bright amber core wrapped in threadlike strands, as though
    a stolen heart has been stitched into place.
    Its silhouette constantly unravels into drifting vapor-arms that reach outward,
    reinforcing the sense that its true body is the influence spreading through the air.
  strengths: |
    Places mesmerized tokens on players and weaponizes social positioning by assigning
    the target to whichever mage is easiest to compromise.
    Excels at coercion loops: compelled plays, forced discards, and hand disruption
    make victims advance the Mesmer's agenda while starving team coordination.
    Psychologically, it turns scarcity and private cravings into tactical liabilities.
  weaknesses: |
    Its control weakens when mages act as a disciplined unit instead of isolated heroes.
    Rapid token removal, cleansing effects, and explicit table coordination deny it time
    to escalate compulsions.
    Narratively, characters who externalize shame and name their cravings are harder for
    the Mesmer to steer through secrecy.
  story_notes: |
    Dorian's warning reframes Clouded Mesmer as an interrogator of motive, not only a
    battlefield threat.  It does not simply force actions; it surfaces hidden wants and
    offers the quickest path to satisfy them, even when that path destroys trust.

    Expedition chroniclers use this encounter to test bonds between mages: who admits
    fear, who hides compromise, and who volunteers to hold the target token when others
    begin to slip.
- name: The Coven
  box: The Descent
  battle: 2
  background: |
    Brama recalls visiting a remote settlement and encountering elders who mocked
    New Gravehold's attempts to build a permanent community.  In those desolate
    caves, the Coven formed around a simple creed: do not resist the Nameless,
    harness them.

    Years later, Brama remembers Donnyton as one of those places where people had
    tried to rebuild ordinary life beyond the city walls.  The Sisterhood elders
    accepted shelter, food, and news from the settlers, then ridiculed their hope
    in private and called permanence a dangerous illusion.

    When Brama returns, that same road leads into silence and broken structures.
    The women who once built hearths now offer survival through surrender, arguing
    that resistance is vanity and submission is the only practical path left.  The
    Coven's real danger is not only their void magic, but the certainty of that
    argument in a world already exhausted by loss.
  appearance: |
    A trio of witches chanting over a bubbling cauldron, their eyes glowing with
    void power, is the image most refugees repeat when they describe the Coven's
    rites.

    In battle, the leading pair is often seen up close: regal, predatory figures
    with horned crowns, dark layered raiment, and controlled expressions that feel
    more judgmental than feral.  Red light glows through fissures in armour and
    cloth, while tendril-like forms coil behind them, turning each confrontation
    into an intimate ritual of persuasion and threat.
  strengths: Uses hex tokens to curse players’ decks and supply piles
  weaknesses: Destroying hex tokens and familiars weakens their spells
- name: The Infecter
  box: The Descent
  battle: 1
  background: 'The Infecter is less a creature than a corrupted landscape.  Leisan
    describes how the ground around it softens into mud and swamp, trees turn gray
    and skeletal, and miles of mire hide swollen figures with melting skin.  Realising
    too late that you stand within its body, you must find and destroy its hidden
    core before the miasma consumes you. '
  appearance: A festering bog whose tendrils creep through the earth; infected husks
    wade through the mire.
  strengths: The Infecter spreads infections among players
  weaknesses: The Infecter lacks strong direct attacks; its power depends on keeping
    infections in play
- name: Absorbing Wraith
  box: The Caverns
  battle: 4
  background: |
    Quilius leads an expedition into lightless caverns beneath New Gravehold, where every tunnel grows colder than the last and torchlight gives brightness without warmth.  Frost creeps across crystal walls, breath hangs in the air, and silence seems to pull explorers deeper into the dark.  There they encounter the Absorbing Wraith: a Nameless presence that feeds on heat itself.

    The creature does not merely freeze flesh; it steals motion and momentum, locking people and magic alike into stasis.  Supply lines become brittle, relics ice over, and even hardened mages feel their strength draining as the temperature drops.  By the time the Wraith is fully revealed, the expedition is already fighting in a battlefield turned to living winter.
  appearance: |
    In the card portrait, Absorbing Wraith appears almost human at first glance: a
    gaunt blue-gray face with pale, lightless eyes and skin stretched tight by cold.
    A skull-adorned golden crown-helm frames the brow and temples, suggesting an
    aristocratic relic fused to something long dead.

    Frosted vapor and blue-white glare bleed around the figure, while the expression
    is fixed in predatory calm rather than rage.  The visual effect is intimate and
    unnerving—less a distant ice spirit than a thinking hunger that studies living
    warmth before taking it.
  strengths: Places stasis tokens on supply piles; frozen piles cannot be purchased
    until freed
  weaknesses: Removing stasis tokens and using fire-based relics thaws the piles
  story_notes: |
    "Cold, colder, coldest." Quilius records the descent as a march into unnatural winter: skin sticking to glittering stone, hands splitting from frost, and blue lips whispering prayers into the dark.  Alcheia’s ruby light offers a thin thread of life, but no true comfort.  At night the scouts chew snow to wet numb throats while the cavern breathes around them like a patient predator.

    The Absorbing Wraith hunts by extinguishing warmth and hope together.  Trails of
    ice mark where it passed, and each encounter leaves more cards and tools trapped
    in stasis.  Quilius senses that the same black silence drawing them forward is
    also the Wraith’s lure, a call toward a fate buried in the deepest tunnels.

    In narration, keep the sensory loop from Quilius's account front and center:
    visible breath, torchlight without heat, skin adhering to frozen stone, and the
    dread of being drawn deeper by silence itself.  Survival should feel procedural
    and fragile—keep moving, keep fires alive, and break frozen holds before
    Gravehold's defenses are locked into permanent cold.
- name: The Reliquary
  box: The Abyss
  battle: 3
  background: 'In the Void, Xaxos watches his daughter age while he remains the same.  He
    describes fighting a human-shaped Nameless and fears that he is repeating his
    old mistakes.  The Reliquary, filled with obsessions and cataclysm cards, tempts
    him to sacrifice his future for power. '
  appearance: A humanoid entity clad in a patchwork of reliquaries and cages, its
    heart replaced by a glowing gem.
  strengths: Uses obsession cards that lure players into gaining powerful but costly
    relics
  weaknesses: Players can avoid taking obsessions and focus on direct damage
- name: Rust Superion
  box: Legacy of Gravehold
  battle: 2
  background: |
    Envelope 2 records Ilya, Force of Aether, defending what once seemed like a harmless practice: using small aether glyphs to nudge weaker Void creatures away from villages and roads.  She insists those controlled patterns were never meant for domination or warfare.

    The fracture came when aether was mixed directly with Void essence at larger scale.  Ilya argues she did not create the resulting monstrosity and points to New Gravehold's own reckless Void experimentation, but her testimony confirms the key danger: once those control patterns are amplified, they can bind behavior, energy flow, and predatory intent into a single engineered engine.

    Rust Superion is the battlefield consequence of that doctrine.  It advances like a living conduit platform, using syphon channels to occupy breaches and convert mage momentum into structured attrition, forcing defenders to fight both the construct and the system of siphons it deploys.
  appearance: |
    Rust Superion appears as a copper-red industrial war construct built from layered armored plates, exposed rotary joints, and thick conduit tubing packed into a broad upper chassis.
    Its silhouette is asymmetrical and tool-like: one arm ends in a heavy pincer claw while articulated secondary manipulators hang beneath the torso for fine adjustments and breach interfacing.
    A segmented tail-cable curves behind it like a powered siphon line, and the entire frame reads as an engineered extractor—less a beast than a mobile machine designed to latch onto opened breaches and drain them methodically.
  story_notes: |
    Narrate Rust Superion as a doctrinal failure made manifest: "harmless guidance magic" scaled into coercive control architecture.  Ilya's testimony should remain morally conflicted—part warning, part self-justification, part accusation toward other Void practitioners.

    In scene terms, emphasize systems pressure over sudden brutality.  Each new syphon in play should feel like the battlefield tightening: fewer safe breaches, fewer clean spell lines, and mounting panic as mages realize the machine is rewiring the flow of aether in real time.

    Give the construct an operator's rhythm.  It does not rage; it calibrates, attaches, reroutes, and advances.  That clinical cadence helps distinguish it from feral Nameless and reinforces the horror of an enemy that behaves like a siege engineer.
  strengths: Draws syphon cards from its syphon deck and places them on breaches,
    making the nemesis board fill with powerful minions
  weaknesses: Limited by the number of syphon cards
- name: Mother of Rust
  box: Legacy of Gravehold
  difficulty: 4
  life: 0
  battle: 2
  background: |
    The Bishop of Scrolls explains that the Mother of Rust is made of countless
    tiny rust creatures that share a single consciousness and gather to form a woman.
    Talix recalls that letting one small piece of rust survive allowed a giant monster
    to form, with metal buggers that attach to skin.  These creatures lack individual
    leadership but share a single consciousness that guides them together like a swarm.
  appearance: |
    A massive humanoid figure composed of rusty metal shards and writhing fragments.
    She takes the form of a woman when united.
  strengths: |
    Summons Rustborn minions that attach to players and drain their life.  At 4+
    Nemesis tokens, all Rustborn activate their RUSH effects.
  weaknesses: |
    Has no life points of her own—players defeat her by eliminating all minions.
  special_rules: |
    This nemesis has no life pool.  Players must defeat all Rustborn minions from
    a special deck to win.  When no Rustborn is in play, one is immediately placed.
    When the Rustborn deck is empty, all active Rustborn gain +1 life.  Victory:
    No Rustborn cards remain in the deck or in play.
- name: Thrice-Dead Prophet
  box: The Outer Dark
  difficulty: 5
  life: 40
  battle: 2
  background: |
    Indira's account describes the Thrice-Dead Prophet as a Nemesis that turns
    victory itself into deception.  It has "died" three times already, each defeat
    revealing too late that the battle was only a feint.  What looked like final
    kills became staged thresholds that tested Gravehold's readiness and drew
    defenders into overconfidence.

    The first apparent death came quickly and bred false certainty.  The second
    victory cost lives and city infrastructure.  The third collapse birthed a new
    catastrophe: from the Prophet's ruined body emerged the Umbra Titan, which
    claimed additional mages before being forced away.  Commanders now treat any
    future fall of the Prophet as potentially incomplete unless the aftermath is
    actively controlled.
  appearance: |
    In the card art, Thrice-Dead Prophet appears as a hulking, stone-like idol body
    studded with sculpted human faces frozen in grief, rage, and terror.  Curved
    horn structures sweep from the crown, while dark crystalline outgrowths jut
    from its shoulders and nearby ground like grave markers.

    Rather than a nimble duelist silhouette, it reads as a walking mausoleum:
    heavy, ceremonial, and wrongfully alive.  The fused faces imply accumulated
    memory or stolen identity, reinforcing the theme that this Nemesis carries
    prior deaths forward instead of ending with them.
  strengths: |
    Gains life points on each Unleash and can ascend to immortality.  At 99+
    life points, players lose immediately.  When the Nemesis deck is depleted,
    players also lose.
  weaknesses: |
    Has no aggressive offence.  Players can focus on burst damage to prevent
    it from reaching higher life thresholds and end the fight quickly.
  special_rules: |
    Starts with 40 life points (55 at increased difficulty).  Two additional
    loss conditions: Players lose at 99+ life points or when the Nemesis deck
    is empty.  At 4+ tokens, a Nemesis card is discarded and 4 tokens are lost.
    Unleash: Prophet gains 5 life points; at 60+ life points, it gains an
    additional Nemesis token.
  story_notes: |
    Narrate Thrice-Dead Prophet as a lesson in premature triumph.  Every apparent
    turning point should feel suspect: cheers cut short, "dead" silence that lasts
    too long, and commanders ordering containment before celebration.

    Keep Indira's historical framing active in campaign scenes—named casualties,
    breached walls, and the memory that Umbra Titan emerged from a prior "victory."
    The emotional beat is disciplined dread: the fourth death must be final, not
    another stage in the Prophet's ritual of attrition.
- name: 'Bishop: Returned'
  box: Legacy of Gravehold
  difficulty: 7
  life: 60
  battle: 3
  background: |
    Bishop: Returned is remembered as a former friend of Gravehold, twisted by his
    own meddling with Void magic until he became the face of the city's grief and rage.
    In survivor retellings, his first defeat was presented as a righteous cleansing:
    a single monstrous culprit on whom the loss of old Gravehold could be pinned while
    New Gravehold rose from the ruins.

    Envelope-era accounts make that triumph sound less final.  New walls, new outposts,
    and newly trained mages did not quiet the unrest outside the city; discontent kept
    spreading faster than the council could cut it out.  Bishop's return is therefore
    both literal and symbolic: the war did not end, it changed shape, and old narratives
    of unity no longer hold.
  appearance: |
    In the illustration, Bishop: Returned appears as a robed hierophant in layered
    crimson and gold vestments over green-bronze armor, with a faceted relic-mask helm
    that obscures all human features.  Pale straps and ringed ornaments hang from the
    mask and shoulders, giving him the ceremonial silhouette of a corrupted high priest.

    A floating tome with luminous eye sigils hovers beside him, pages flaring with blue
    arcane mist while script-ribbons and breach-like currents spiral around his outstretched
    hand.  The visual language suggests command through forbidden knowledge rather than
    brute force.
  strengths: |
    Bishop: Returned converts board state into momentum through Nemesis-token acceleration
    and reinforcement cycles.  Token gain from Unleash and minion tiers creates recurring
    summoning windows that refill pressure, tax player actions, and make stalled turns
    increasingly dangerous.
  weaknesses: |
    His engine is predictable once identified.  If mages aggressively clear minions,
    deny token spikes before the reinforcement threshold, and sequence burst turns around
    summon timing, they can keep the loop from stabilizing and strip him of tempo control.
  special_rules: |
    Unleash: Gains 1 Nemesis token.  At 5+ tokens, reinforcements are activated—two
    deck cards are revealed, a minion is played, then the Nemesis loses 4 tokens.
    Empty decks are reshuffled with minions from the discard pile.  At increased
    difficulty, when reinforcements are summoned, Bishop: Returned loses 3 tokens
    instead of 4.
  story_notes: |
    Narrate Bishop: Returned with the cadence of a dangerous storyteller: persuasive,
    theatrical, and half-truthful.  He frames himself as proof that New Gravehold's
    leaders needed a villain and chose a former ally to bear collective blame.

    The encounter should feel like a public reckoning in arcane form: pages in the air,
    accusations made flesh, and a city discovering that defeating a friend-turned-nemesis
    did not remove the fear, ambition, and factional fractures that created him.
- name: The Blight
  box: The Descent
  battle: 3
  background: |
    The Blight is treated in expedition logs as a living continuation of the old
    catastrophe that annihilated Karek.  Veterans describe it as the same emerald
    corruption made mobile: a force that does not merely kill, but preserves terror
    in crystal so that every battlefield becomes a monument to the moment people
    realized they could not run fast enough.

    Raven, the Lone Survivor, frames this encounter as a fight against a
    blighted god rather than an ordinary beast.  She describes battlefields littered
    with familiar faces preserved like trophies in crystal and warns that the creature
    grows each day until it obscures the horizon.

    Survivors do not speak of "defeating" the Blight so much as surviving passage
    through its territory long enough to protect those still evacuating.  The Nemesis
    advances like a natural disaster—slow, immense, and indifferent—while the
    horizon itself seems to turn green and harden.
  appearance: |
    In the illustration, The Blight appears as a colossal, low-slung predator of
    stone-like flesh and emerald crystal plating.  Jagged green growths crown its
    shoulders and spine like fractured cliffs, while thick forelimbs drive it forward
    with the weight of a siege engine.  Its face is narrow and predatory, with glowing
    yellow eyes set behind crystalline ridges and a maw lined by shard-like teeth.

    A pale green haze surrounds the creature, softening the background while making
    its crystal protrusions look even sharper.  The overall silhouette feels less like
    an animal and more like a moving landslide of blighted mineral.
  strengths: |
    The Blight converts battlefield pressure into long-term attrition.  It introduces
    tainted resources and crystal effects that clog player decks, reduce card quality,
    and punish normal economy lines.  Defensive crystal structures also buy it time,
    forcing mages to divide attention between breaking protections and maintaining
    enough tempo to avoid being buried by corruption.
  weaknesses: |
    Its momentum depends on maintaining blight infrastructure.  Coordinated teams that
    remove blight crystals early, deny persistent corruption pieces, and prioritize
    deck hygiene can prevent the Nemesis from reaching a locked game state.  Once the
    crystal engine is disrupted, concentrated damage windows become possible.
  story_notes: |
    Narrate this battle as a confrontation with inherited trauma.  Every crystal field
    should evoke the fate of Karek and the fear that history is repeating in real time.

    Keep the stakes human and immediate: protect survivors, preserve memory, and refuse
    to let the Blight turn one more city into a silent emerald grave.
- name: Infested Mutation
  box: Past and Future
  battle: 3
  background: 'The Infested Mutation is gigantic—far larger than any normal Nameless.
    On the train from Port Hanon to Erythiza, one such creature attached itself to the
    breach engine, subsuming it entirely into its mass.  It inched along the train like
    a caterpillar, leaving a black trail of toxic sludge in its wake.  Passengers from
    the first car stumbled out already infected, their bodies melting into goo.  Kavoc,
    witnessing the horror, could barely believe it: "That can''t be a Nameless.  That''s
    gigantic.  They don''t get that big, do they?"'
  appearance: A gigantic, sickly blistered mass with a semi-transparent goo stomach
    through which swallowed objects float visibly.  It moves like a caterpillar, leaving
    a black trail of toxic sludge, and constantly sprouts new growths of limbs and tentacles.
  strengths: Spawns oozes and mutated minions from its ooze deck
  weaknesses: Destroying ooze minions and purging mutation cards reduces its power
- name: Paradox of Myth and Bone
  box: Legacy of Gravehold
  battle: 3
  background: 'The Bishop of Scrolls recounts discovering an enchanted mask radiating
    magical power and a huge beast called Bone drawn to the mask.  Together they form
    a deadly pair: the beast provides raw strength while the mask controls and drains
    its magic.  Joined by parasitic chains, they become an even greater threat than
    they were apart. '
  appearance: A hulking skeletal beast bound by glowing chains to a floating ornate
    mask that hovers above its head.
  strengths: Uses two separate nemesis decks (Myth and Bone) that must both be depleted
    to win
  weaknesses: Splitting focus can prolong the fight; players can choose to defeat
    one deck quickly to limit the pair’s options
- name: Rust Amalgam
  box: Legacy of Gravehold
  battle: 3
  background: |
    Talix's Envelope 16 testimony frames Rust Amalgam as the cost of leniency during
    Void experimentation: one tiny rust-creature escaped, survived, and returned as a
    house-sized predator.  What once looked too small to matter became a multiplying
    threat in a matter of days.

    Her account blames two linked failures.  First, defenders underestimated remnants
    shed from the Mother of Rust and treated them as harmless debris.  Second, Z'hana's
    followers fed captured fragments with Void energy near active portals, accelerating
    growth and forcing unstable adaptation.

    Rust Amalgam now propagates by shedding metal parasites that detach from its own
    body and latch onto skin, armor seams, and breach gear.  Each new wound it causes
    is narrated by survivors as preventable—a living indictment of reckless research
    and poor containment discipline.
  appearance: |
    Rust Amalgam appears as a low-slung, serpentine mass made from interlocked rusted
    plates and cable-like coils, as though scrap-metal tendons were braided into one
    predatory body.
    Its skull is wedge-shaped with multiple elongated yellow eye-slits and a furnace
    glow behind jagged teeth, giving it the look of a mobile smelter turned carnivore.
    Looping tendrils and segmented tail-whips arc from its back and flanks while
    smaller detachments cling to the chassis, reinforcing the sense that the creature
    is both singular beast and parasite nursery.
  story_notes: |
    Use Rust Amalgam encounters to foreground consequence and accountability.  Talix's
    voice should carry anger at procedural negligence: one overlooked fragment, one
    careless experiment, and now entire teams pay the price.

    Narrate battlefield pressure as contamination spread.  A scratch is never "minor";
    it is the start of attachment, draining stamina, splitting formation focus, and
    forcing triage decisions under fire.

    Keep the creature's movement predatory but mechanical—coiling, lashing, shedding,
    reattaching—so scenes emphasize that this Nemesis is a self-repairing infestation
    engine, not a simple brute to out-damage.
  strengths: Uses a parasite deck
  weaknesses: Parasite cards can be destroyed or purged to thin the parasite deck
- name: The Changeling Nest
  box: Past and Future
  battle: 3
  background: |
    In Xaxos's exile journal, the Changeling Nest first appears as a location rather
    than an enemy: a choking green swamp threaded with distended cocoons that glow
    dimly among vines and muck.  Nothing seems overtly unnatural by Void standards
    until touch breaks the illusion—its silk is warm.

    That warmth is the lure.  Xaxos writes that after long isolation he was entranced,
    stepped closer, and discovered a human silhouette floating inside one cocoon.
    Knowing it could be a trap, he tore the sticky skin open anyway and caught a little
    girl as she fell into his arms.  She was unmistakably human, yet altered.

    The rescue triggered the reveal: silence collapsed, branches bent into antlers,
    and eyes opened through the swamp canopy.  What seemed to be terrain proved to be
    one coordinated organism.  The Changeling Nest preys on compassion as efficiently
    as on fear.
  appearance: |
    A deer-faced humanoid torso with bark-dark skin and spiraling amber eyes rises from
    a mass of living swamp-growth, crowned by antlers that merge into branch networks.
    Around it hang blue-white cocoons suspended like lanterns, each wrapped in slick
    silk and shadowed by child-sized silhouettes.
    Vines loop across the frame like tendons, suggesting the "creature" and the marsh
    are one body with many limbs.
  strengths: |
    Starts with multiple cocoon cards in play and scales damage based on unresolved
    cocoons, turning delay into a direct clock against players and Gravehold.
    Excels at pressure through rescue dilemmas: every cocoon implies a captive, forcing
    defenders to spend tempo on triage while the Nest hatches further threats.
    Its psychological edge comes from appearing hospitable—warm, quiet, almost safe—
    until the battlefield is already inside its body.
  weaknesses: |
    Destroying cocoons early sharply reduces its damage ceiling and interrupts hatch
    chains before they snowball.
    Coordinated focus fire on cocoon infrastructure prevents the Nest from converting
    compassion-driven hesitation into board collapse.
    Narratively, parties that establish extraction protocols before contact are less
    vulnerable to its bait-and-reveal ambush pattern.
  story_notes: |
    Xaxos records details that narrators can reuse scene by scene: sticky silk warm to
    the palm, the unnaturally silent swamp, claw-like nails from prolonged Void
    exposure, and the instant a "place" starts looking back.

    His account also links the Nest to wider continuity.  The rescued child can be read
    as one of the "collected" children who later surface in altered forms, supporting
    storylines around Lily, Qu, and other survivors whose humanity persists through
    change.
- name: Corruption's Core
  box: Past and Future
  battle: 4
  background: |
    In the Future expedition, Corruption's Core dwells at the heart of Duskling
    Tower—a structure taller than any castle, taller even than the legends of
    Old Gravehold, rising in the center of a city that wanders through the True
    Void.  "You should not have come here," it hisses.  "I have trapped it
    here."  The creature bears an unsettling resemblance to Naftir; when the
    mages confront it, Naftir's own eyes begin to glow blue as the corruption
    recognizes something of itself in him.

    Xaxos describes the force behind it as Void essence: the opposite of aether,
    a concentrated entropy that breaks living forms down and remakes them into
    twisted reflections.  In his exile journals he writes that prolonged exposure
    hardens flesh into scales and alters the mind as surely as the body.  The
    city around Duskling Tower, with forests, roads, and even ancient ruins,
    feels like a fragment of the world dragged across a breach and reshaped by
    the same corruptive pressure.

    Corruption's Core is not merely a guardian of that place but its animating
    will: a keeper that seeks to reduce life to dust while proving that identity
    itself can be rewritten by the Void.
  appearance: |
    A corrupted creature with features resembling Naftir, surrounded by pulsing
    black and violet energy.  Its glass bones show through corrupted flesh, and
    tendrils of crackling void extend from its form.

    In card art, the figure appears almost avian and ceremonial: a narrow,
    beak-like mask beneath luminous goggles, framed by white-violet fur and
    streaming ribbons of dark energy.  Before it hovers a radiant sphere of
    condensed void power, from which hooked shadow-spines arc outward like claws
    reaching into the battlefield.  The composition suggests a cold researcher
    turned executioner, channeling corruption as a precise instrument rather than
    a wild storm.
  strengths: Uses void tokens placed on breaches; its connection to Naftir's bloodline
    gives it insight into the mages' weaknesses
  weaknesses: Players can remove void tokens or avoid casting from void-infested breaches
    to slow its advance; defeating it severs its hold on the Duskling Tower
- name: Griefweaver
  box: Legacy of Gravehold
  difficulty: 8
  life: 60
  battle: 4
  background: |
    The Bishop of Scrolls describes an encounter in the wasteland of the Void where he at
    first mistook the silhouette of Griefweaver's fingers on the horizon for another
    traveller.  As the creature approached he realised that only its arms and torso
    resembled a person.  The towering beast rose taller than the walls of New Gravehold,
    its lust for magic and gems visible in the way it clutched shining trinkets.  The
    Bishop notes that the aether of fallen mages can reform itself into Nameless through
    the Fountain of Souls and speculates that Griefweaver may be an old comrade reborn as a
    mindless husk, drawn only to the magical accoutrements it once carried into battle.
    Despite this, the Bishop recruits the creature into his crusade, finding poignancy in
    the idea that a former friend now fights again at his side for the salvation of their
    people.
  appearance: |
    A colossal, many-armed Void creature with a vaguely humanoid torso.  Its long
    arms and countless hands reach across horizons grasping at shining gems and
    magical symbols.  It towers over the walls of New Gravehold and its heart burns
    with a greedy glow.  The silhouette was mistaken for a traveller from afar.
  strengths: |
    Griefweaver binds supply piles with fetters and deprives mages of resources while
    drawing power from the number of covered piles.
  weaknesses: |
    Mages can release fetters by striking them or spending Aether to free the bound
    piles.
  special_rules: |
    Unleash: Draws a card from the Fetter deck and puts it into play.  Fetters block
    supply piles—players cannot acquire cards from these piles until the fetter is
    defeated.  Setup restriction: Maximum 4 gem, 3 relic or 5 spell piles; no more
    than 9 piles total.  At increased difficulty, a supply pile is destroyed; each
    fetter gains +1 life.
- name: Mist Revealed
  box: Legacy of Gravehold
  difficulty: 10
  life: 80
  battle: 4
  background: |
    In a haunting monologue, Mist warns that she will be remembered as the mage who
    unleashed the ultimate threat, hoping her name will unite people to fight a common
    enemy.  Mist Revealed is not a creature but a looming threat brought forth by
    Mist's actions through Void magic.  The character speaks of creating an existential
    danger to unite humanity.
  appearance: |
    A swirling mass of ghostly fragments and arcane seals.  Mist's silhouette is
    barely visible within.  The artwork represents the Griefweaver character from
    the Legacy of Gravehold set.
  strengths: |
    Uses a Fragment deck.  When all Fragment cards are in play, Mist wins.  Has no
    maximum life limit.
  weaknesses: |
    Players must manage the Fragment deck by discarding or silencing fragments
    before the field is full.
  special_rules: |
    Unleash: All "UNLEASH:" effects of fragments are resolved, then a card is drawn
    from the Fragment deck.  When the Fragment deck is empty, the discard pile is
    reshuffled.  At increased difficulty, the oldest fragment effect is resolved at
    the start of the Nemesis turn.
- name: Paradox of Myth
  box: Legacy of Gravehold
  battle: 4
  background: 'Little lore exists about the Paradox of Myth outside of its campaign
    appearance.  This nemesis embodies the living memories of villagers and turns
    their will against the mages. '
  appearance: A shifting rift filled with ghostly villagers clutching relics and scrolls.
  strengths: Uses a villager deck
  weaknesses: Players must manage the villager deck by defeating villagers and spending
    aether to remove power tokens
- name: Paradox of Bone
  box: Legacy of Gravehold
  difficulty: 8
  life: 80
  battle: 4
  background: |
    The Paradox of Bone has no widely published lore; its origins and motives remain
    shrouded in mystery.  In the campaign it emerges from the Void, bound to the
    remnants of a massive skeletal beast.  Xaxos describes it as the "purest distillation"
    of what the Void creates—a being driven to pure madness and destructive rage through
    overwhelming forces.
  appearance: |
    A bony, feral creature with chaotic and aggressive design.  It is a massive,
    ossified creature bound in chains whose ribs glow with dark energy.  The design
    focuses on organic, bone-like structures.
  strengths: |
    Uses the Bone deck.  Two tokens (Gem/Relic and Spell) move on a track when
    players acquire cards.
  weaknesses: |
    Defeating Bone minions and depleting the Bone deck reveals the Paradox and
    allows players to deal damage.
  special_rules: |
    Bone Track system: Gem/Relic token advances when players acquire gems/relics;
    Spell token advances when players acquire spells.  Unleash: Gravehold suffers
    damage equal to the difference between both token positions; the more advanced
    token advances one space.  On exhaustion, players must collectively discard
    four gems instead of triggering Unleash twice.  At increased difficulty, cards
    of the same type as the trailing token cost an additional 1 Aether.
- name: Wraithmonger
  box: The Outer Dark
  difficulty: 6
  life: 70
  battle: 4
  background: |
    Wraithmonger is described by Indira as a Nameless tied to sleep itself, a horror
    that does not strike first through claws but through dreams.  Gravehold's people,
    already starved for rest, face a cruel paradox: sleep is scarce, yet whenever it
    comes the thing can manifest and feed.

    Indira's account insists Wraithmonger is not "born of the Void like the others"
    in any ordinary sense.  She frames it as a shapeless terror buried within human
    minds that flickers into the waking world only when dreamers loosen their guard.
    It rises above the city on tendrils of pale mist, leeching fear and carrying that
    terror from sleeper to sleeper.
  appearance: |
    In the card art, Wraithmonger resembles a floating violet cephalopod crowned
    with a skull-like dome.  Multiple eye sockets are hollowed into the head-shell,
    each filled with dark red void-glow that makes the face look both dead and
    watchful.

    Long tentacles trail in all directions, lined with pale dotted seams and fine
    threadlike filaments that read like dream-sutures.  The body hangs weightless in
    blue-green haze, suggesting a creature that drifts through thought and air alike
    rather than moving by ordinary muscle or bone.
  strengths: |
    Mental attacks progressively debilitate player abilities.  7 Terror tiles on
    a special Nemesis mat block player abilities until they are paid off.
  weaknesses: |
    Players can reset all tiles by paying (4 charges per tile).
  special_rules: |
    Unleash: The player with the fewest Terror tiles takes the highest unclaimed
    Terror tile and triggers its effect.  Terror tiles block player abilities.
    When tile 1 is claimed, all players lose immediately.  At increased difficulty,
    tile 7 is removed.
  story_notes: |
    Narrate Wraithmonger as intimate dread instead of battlefield spectacle.  The
    threat begins before combat: heavy eyelids, fear of sleep, and exhausted citizens
    bargaining with themselves for one more waking hour.

    Use Indira's voice to anchor tone—dreaming as vulnerability, terror as a harvested
    resource, and Yan Magda as a grim contrast because she no longer sleeps after the
    Black Mausoleum years.  The central question for scenes around this nemesis is not
    "Can we kill it?" but "Can a city survive when rest itself becomes a breach?"
- name: The Wrath
  box: The Descent
  battle: 4
  background: |
    The Wrath is the siege-beast that descends on Karek after Brama's expedition
    enters the city.  Field testimony describes something humanoid but wrong—too fast,
    too predatory, and too deliberate for panic to explain.  Its arrival at the gates
    turns defense into triage within minutes, stone dust raining from impact points as
    if the walls themselves are being tested for collapse.

    Brama's surviving accounts emphasize method over heroics: surround, rotate strike
    teams, never let it settle into a kill rhythm.  Even then, the cost is severe.
    Janti is mortally wounded and dies hours later, becoming the emotional scar
    attached to every later briefing on The Wrath.  The creature eventually withdraws
    into darkness, but not in defeat that feels final—more like a predator deciding
    when to return.
  appearance: |
    In the card art, The Wrath appears as a crimson, horned predator crouched low as if
    about to spring.  Its musculature is heavy and asymmetrical, with elongated forearms
    ending in black, hooked claws that read more like climbing talons than hands.

    Curled ram-like horns frame a snarling face of needle teeth and ember-bright eyes.
    Spined growths and shadowed tendrils arc behind the body, giving the silhouette a
    jagged, multi-limbed profile even when it stands still.  The pose conveys explosive
    momentum: this is not a lumbering brute but a fast breach-hunter built for sudden,
    fatal engagement.
  strengths: Uses a Rage track that advances whenever it unleashes; single blows
    are devastating enough to kill veteran fighters
  weaknesses: Players can reset the Rage track with certain card effects or by destroying
    its minions; it does not seem very smart and can be kept off-balance by multiple
    attackers alternating strikes
- name: The Timeless
  box: The Surface
  difficulty: 8
  life: 60
  battle: 3
  battle_5_setup: |
    During setup, swap one of the nemesis turn order cards for the Unleash turn
    order card. Play using increased difficulty.
  background: |
    Scouts describe The Timeless as a Nameless tied to temporal distortion in the
    Void.  Testimony from Qu, the Changeling, frames the creature as paradoxical:
    ancient and too young at once, with its presence linked to memory loss,
    age-disorientation, and the terror of time slipping out of order.
  appearance: |
    The card art depicts a skeletal, horned Nameless with elongated limbs rising
    over a red breach line.
  strengths: |
    Its known battle-5 modifier increases Unleash cadence by changing turn-order
    composition and pairing that change with increased-difficulty rules.  Reports
    also emphasize psychological pressure: it destabilizes a mage's sense of age,
    history, and continuity.
  weaknesses: |
    Reliable tactical counters are not yet well documented in this source set.
    Commanders prioritize disciplined turn planning, memory anchors, and calm
    coordination when confronting it.
  story_notes: |
    Qu's account links The Timeless to life in the Void where sunrise and sunset
    lose meaning, memory becomes unreliable, and survivors struggle to measure
    their own aging.  Narration should treat this nemesis as a threat to temporal
    identity as much as to bodily survival.

    Dalana's "Journey's End" poem (Envelope 4) offers optional connective imagery for
    related descent scenes: red light above, blood-dark earth below, and a thin line
    between ending and beginning.  Use that cadence when campaigns want The Timeless
    to feel like a threshold event rather than a single encounter.
- name: Rampaging Vin
  box: The Returned
  difficulty: 8
  life: 60
  battle: 4
  battle_5_setup: |
    During setup, swap one of the nemesis turn order cards for the Unleash turn
    order card. Setup: Gravehold suffers 8 damage.
  background: |
    Tressa's field account describes Rampaging Vin as an aggressive Nameless that
    repeatedly charges in cramped cave terrain, leaving little room to maneuver.
    Her testimony frames the encounter as brutally direct and unusually personal
    in pressure.
  appearance: |
    Card art depicts a massive serpent-like Nameless with multiple limbs and
    clusters of yellow, eye-like growths across a green carapace.
  strengths: |
    It applies immediate pressure through setup damage to Gravehold and a
    turn-order swap that increases Unleash cadence, forcing defenders to stabilize
    under tempo disadvantage.
  weaknesses: |
    Confirmed tactical counters are limited in this source set; survival planning
    prioritizes positioning discipline, early mitigation, and coordinated response
    to repeated frontal pressure.
  story_notes: |
    Tressa's narration emphasizes claustrophobic cave fighting, repeated charges,
    and the emotional weight of risking her treasure-gathered resources for her
    son's future.
