mages:
- id: adelheim
  name: Adelheim
  background: Adelheim is a Gravehold weaponsmith turned breach mage who crafts weapons
    from breach ore.  Practical and protective, he treats his forge as a duty and
    prefers preparation over heroics.  As he says, "It is folly what I do, to make
    things in a place where everything is broken."  He believes survival depends
    on discipline and dependable defense.
  appearance: A rugged craftsman with a weathered face and calloused hands.  He wears
    practical work clothes suited for the forge, with leather aprons and tool belts.
    His posture reflects years of labor, and his eyes carry the weight of responsibility.
  strengths: As a support/utility mage Adelheim excels at protecting his companions
  weaknesses: Adelheim’s reliance on exhausting attacks means his power is reactive
    rather than offensive
  story_notes: Adelheim advised an expedition on unusual tracks and stayed behind to
    reinforce Gravehold’s defenses.
  variants:
  - box: Aeon's End (Core Set)
- id: brama
  name: Brama
  background: Brama is the elder of Gravehold, the last survivor of her conclave of
    sisters—all now ash in the world.  She is a calm, authoritative mentor with a
    nurturing core who advises the city to seal itself in the cave.  Despite her
    long years she maintains hope that Gravehold will return to the light.
  appearance: An aged, dignified woman with silver-streaked hair and wise, knowing eyes.
    She wears flowing robes befitting her role as Elder, and her presence radiates
    authority and maternal warmth.  Her hands bear the marks of decades of spell-casting.
  strengths: Brama is a healing mage
  weaknesses: Low direct harm output; she is primarily a support character
  story_notes: Brama led survivors into the tunnels after the fall of Gravehold, training
    new mages and rejecting forbidden power.  She was briefly captured by the Fungal Mesh,
    rescued by the expedition, and later helped defeat a memory‑eating Nameless.  She
    fought through the final campaigns, mourning the corrupted ally lost to the Void
    while committing to rebuild and train New Gravehold's defenders.  In The Descent,
    Brama joins the Followers and leads an expedition to find Karek, the fabled city
    with the brass dome—a legend she has dreamed of her whole life.  When the walls
    finally loom on the horizon, her legs shake with the joy of seeing that the city
    is real and solid.  But inside she finds only horror—a miles-wide mausoleum of
    green glass, families frozen mid-flight, children reaching for parents who could
    not save them.  She rescues Raven, last survivor of the First Tribe, and learns
    that Karek was the original Gravehold.  When monsters close in, she watches
    Thraxir—her friend, her Commander—die holding the line so she can blast open the
    city gates with her sister-words.  She memorizes the empty gray of his eyes,
    bites her lip until it bleeds, and keeps moving.  In the final battle against
    The Wrath, she loses Janti too—her lover, found dying in the darkness hours after
    victory.  Brama kisses her as she dies, takes Janti's Sister necklace and staff,
    and vows to protect Gravehold and be the leader Janti believed she could be.
    The campaign ends with Brama holding Janti's staff, watching the signal fire
    burn above reclaimed Karek, knowing there is much work to be done.
  variants:
  - box: Aeon's End (Core Set)
  - box: The Descent
    background: |
      In The Descent, Brama is a guardian of ancient texts who dreams of lost
      civilizations.  Past 3 testimony captures her urgency: the Calamity warped
      plants, animals, and even stone into ambush predators, making open settlements
      feel indefensible.  She rejects nostalgia for sprawling pre-Fall cities and
      searches instead for a true stronghold city that can survive sustained Nameless
      assault.  She is inspired by Janti, who arrives from outside.
    appearance: Brama appears as "The Leader" with a dignified, serious expression
      that underscores her role as keeper of knowledge and leader of the survivors.
    strengths: Her Regenerate ability (5 charges) lets her gain 4 life, and optionally
      deal 2 damage to herself to heal Gravehold for 4 life.
    weaknesses: Focused on healing and self-sacrifice rather than offense.
- id: jian
  name: Jian
  background: After her father died Jian found one of his orbs and retreated into
    silence.  She learned the sister‑words but rarely speaks them, instead seeing
    multiple possible worlds and believing she is destined to save them.  As she
    says, "Once, I was born. Soon, I will save them, then become nothing."  Jian
    describes seeing a web connecting everything and trusting it to guide her.
  appearance: A young woman with an ethereal, mystical presence and a contemplative
    expression.  She wears magical robes befitting a spellcaster and often carries
    one of her father's mysterious orbs.  Her eyes seem to look beyond the present
    into distant possibilities.
  strengths: Jian can manipulate breaches and use visions to prepare for future turns
  weaknesses: Her introspective nature may cause hesitation
  variants:
  - box: Aeon's End (Core Set)
- id: kadir
  name: Kadir
  background: Kadir is a seasoned cavern scout who explores deep underground caves
    and searches for an ancient sleeping god.  She believes salvation lies in the
    depths beneath the city, saying "In the deep there is peace. In the deep, there
    is wisdom that wells up from within as your self dissolves into the emptiness."
  appearance: A focused woman in mystical dark blue robes with green and emerald
    accents.  Her face is concentrated and determined, and she carries herself with
    the confidence of someone who has mapped the deepest caverns.
  strengths: Her Otherworldly Gate ability lets allies retrieve spells and prepare
    multiple spells per breach
  weaknesses: Her obsession with the depths may cloud her judgement
  story_notes: Kadir led multiple expeditions beneath Gravehold, mapping passages and
    identifying underworld creatures.  She later advocated broader exploration when
    new paths beyond the caves emerged.
  variants:
  - box: Aeon's End (Core Set)
  - box: Legacy of Gravehold
    background: In Legacy of Gravehold, Kadir is an experienced mage with scientific
      inclinations who was once a teacher.  He trusts Z'hana but regrets her curiosity,
      saying "Z'hana has always wanted more than she needed" and blaming her for
      Gravehold's destruction.
    appearance: The card art by Esty Swandana shows Kadir in a more mature, weathered
      state befitting a veteran mage.
    strengths: His Refine Prototype ability uses path tokens that can be placed,
      flipped, and activated for various effects
    weaknesses: High complexity (5) requires careful planning and token management
- id: lash
  name: Lash
  background: Lash is an upbeat, fearless optimist who refuses to let hard times
    crush his spirit.  He reflects, "Like the jagged rocks around us, these are hard
    times," yet finds beauty in ordinary moments—watching the market where people
    hope and dream despite adversity.  He draws strength from ordinary people and
    fights to keep hope alive, using humor and bravado to steady the group.
  appearance: A youthful scout with an energetic bearing and a ready smile.  His
    clothing is practical but worn, and his eyes sparkle with irrepressible optimism
    even amid the darkness of Gravehold.
  strengths: Lash can prep and fire spells quickly and has access to cards that reward
    optimism
  weaknesses: Limited defensive abilities; relies on momentum to stay ahead
  story_notes: During early expeditions, Lash kept morale high by charging ahead,
    joking, and naming strange creatures while the group pushed through the dark.
  variants:
  - box: Aeon's End (Core Set)
- id: mist
  name: Mist
  background: |
    Mist is a vigilant scout and Dagger Captain who masks fear with discipline.
    She does not see herself as brave despite others viewing her as a hero, describing
    breach work as traumatic—"Every time I have left splinters of myself behind."
    In Envelope 19 testimony she crosses a darker threshold: she is willing to become
    a villain in public memory if fear of her can weld fractured factions into one
    fighting body.  Mist calls this gamble the path to a "Second Fall," accepting
    hatred as the cost of forced unity.
  appearance: A lean front-line commander in dark, battle-worn armor with ritual
    markings and scout gear cut for speed.  In Mist Revealed depictions she wears
    a gold-trimmed hood and presses a shard-like mask plate over one eye while glowing
    script burns along her face and throat—part confession, part self-anointing as
    the threat everyone must answer.
  strengths: Mist is a support mage
  weaknesses: Low innate harm and reliance on allies for full effectiveness
  story_notes: Mist fought through the fall of Gravehold, confronting Xaxos and helping
    shepherd survivors into the tunnels.  She later led surface scouting, helped rescue
    Brama from the Fungal Mesh, and coordinated defenses against fog‑shrouded and
    memory‑eating Nameless.  She witnessed the corrupted ally’s final fall into the
    Void during the war’s end.
  variants:
  - box: Aeon's End (Core Set)
- id: phaedraxa
  name: Phaedraxa
  background: Phaedraxa is a seeress with temporal abilities who was born before the
    world's destruction and can perceive past and future events.  She describes herself
    as one who "sees the webs" of time and works with Gravehold's survivors.  Her calm, fatalistic counsel warns against the
    Gate Witch’s influence over time.
  appearance: A mystic figure in flowing robes with an enigmatic, knowing expression.
    Her eyes seem to look through the present into other times, and she carries
    runes and symbols of her temporal craft.  Her bearing is otherworldly and serene.
  strengths: Her Auspex Rune ability (5 charges) prevents all damage to players and
    Gravehold for an entire turn
  weaknesses: Limited offensive options; starting with fewer breaches reduces flexibility
  story_notes: Phaedraxa’s sermons during the war emphasized cyclical time and warned
    that the Gate Witch bends that flow.
  variants:
  - box: Aeon's End (Core Set)
- id: xaxos
  name: Xaxos
  character_id: xaxos
  background: Xaxos is a mage-heretic who devotes himself to the enemy to gain knowledge.
    He says, "I have recognized our path to salvation, splintered and dangerous,
    straight through the heart of the Void."  He explores dark powers to discover
    how to shape worlds rather than merely destroy them—a philosophy that brands
    him as a heretic.
  appearance: A scholar in mystical purple robes adorned with arcane symbols.  His
    face shows concentrated wisdom, and he is often depicted in meditative poses
    with magical energies swirling around him.  His hood often shadows his features.
  strengths: Xaxos is a support mage who helps others charge their abilities and manipulate
    the sequence of actions
  weaknesses: He inflicts little harm himself and depends on allies to make use of
    extra opportunities
  story_notes: |
    Xaxos opened a catastrophic breach during the fall of Gravehold and vanished into
    the Void.  He later returned multiple times urging the use of Nameless power,
    clashing with other elders, and ultimately became a corrupted foe in the final war.
    After his defeat, a tendril dragged him back into the Void, leaving his fate
    uncertain.

    Exile journals attributed to him add tactile field details used across later
    expeditions: warmth where the Void should be cold, "silent" terrain that is actually
    alive, and the moral trap of rescue under uncertain corruption.  His Changeling Nest
    account—tearing open a cocoon to free a child despite suspecting an ambush—positions
    him as both reckless and compassionate, a narrator-useful tension that complicates
    his legacy.
  variants:
  - box: Aeon's End (Core Set)
  - box: The Void
    background: |
      In The Void era, Xaxos has already crossed the line from controversial theorist to exile field-commander.  Time distortion in the Void erodes his sense of sequence; he records watching his daughter age while he remains physically unchanged, a fracture that deepens both his guilt and his urgency.

      He no longer speaks about "mastering" danger in abstract terms.  His journals fixate on triage choices—what to seal, what to sacrifice, and who can still be saved before another breach cascade begins.  He fears that every desperate tactic brings him closer to the same spiral of mistakes that once summoned catastrophe.
    appearance: |
      Depicted as a hooded void-bringer in dark layered robes, Xaxos stands amid fractured stone and breach-light that glows in sickly green and teal arcs.  His stance is defensive rather than triumphant, with one hand bracing a portal seam while the other channels volatile energy as if trying to hold a collapsing boundary closed by force of will.
    strengths: Xaxos (The Void) requires sacrifice from his allies to unlock his power
    weaknesses: Xaxos’s power hinges on forcing allies to set aside cards—either chosen
      by the ally for Pyre or at random for his ability
    story_notes: |
      In exile, Xaxos journals his travels through the Void and repeatedly questions whether he is documenting threats or creating them by pursuing understanding at any cost.  After encounters with entities such as the Herald of the End and the Reliquary, his notes frame the Void as a mirror that reflects intention back as consequence.

      A recurring thread for narration is his paradoxical self-diagnosis: "too old and too young," both villain and hero in the same campaign.  Use this to anchor scenes where he mentors younger mages while privately fearing he is teaching them the first steps of his own downfall.
  - box: The Abyss
    background: In this timeline, Xaxos is a determined scholar shaped by his
      mother’s rescued knowledge.  He refuses to hide and believes knowledge has
      value only when used to fight back.
    appearance: A young trans man clutching ancient books, with fierce determination
      in his eyes.
    strengths: Xaxos is a risk‑reward mage
    weaknesses: His strategy can give the nemesis additional turns if misused
- id: malastar
  name: Malastar
  background: Malastar is a seasoned mage who teaches young talents the "language of
    all things" and guides them through dangerous trials, including descents into
    caves and battles against mystical beasts.  Many of her students do not survive
    these ordeals.  She is patient yet stern, carrying the burden of sending students
    into danger.
  appearance: A dark, mystical figure with a powerful magical aura befitting her role
    as a master mage and mentor.  Her presence commands respect, and she carries
    herself with the gravity of one who has seen many students fall.
  strengths: Malastar is both supportive and offensive
  weaknesses: Limited breach slots restrict his early-game flexibility
  story_notes: Malastar defended old Gravehold during the fall and helped evacuate
    survivors into the tunnels.  He later forged equipment from Nameless pods, supported
    the rescue of Brama, and guided specialization training through fog‑shrouded and
    memory‑eating threats.  In the final battle he tried to stop the corrupted ally
    from seizing breach power before the Void claimed him.
  variants:
  - box: The Nameless
- id: nym
  name: Nym
  background: Nym is a fierce breach mage apprentice who rejects Malastar's philosophy
    of respecting enemies.  She sees the Nameless as mere monsters and has turned
    many to ash.  She overcomes her fear through anger and refuses to give enemies
    anything but her fire.
  appearance: A fire-themed young woman depicted with lava and flame motifs.  Her
    expression shows fierce determination, and her magical focus burns with an
    inner fire that reflects her passionate approach to combat.
  strengths: Nym excels at thinning the nemesis deck
  weaknesses: Nym inflicts no direct harm and relies entirely on his ability to mill
    the nemesis deck
  variants:
  - box: The Depths
- id: reeve
  name: Reeve
  background: Reeve is a warrior who lost an arm to tainted jade and amputated it
    herself.  She sees herself as a blunt instrument to be used against monsters
    and finds fulfillment fighting creatures in the depths.  She says she is destined
    for this place.
  appearance: A one-armed fighter in dark, heavy armor wielding a large axe or cleaver
    called Chopper.  Her face is marked and scarred, showing her as an experienced,
    battle-hardened warrior.
  strengths: Reeve’s ability Quelling Blade requires four charges and inflicts five
    harm to one lesser foes and three harm to a different lesser foes
  weaknesses: Reeve’s strength lies in killing lesser foes; she has less impact when
    the nemesis deck contains few lesser foes
  variants:
  - box: The Depths
- id: z-hana
  name: Z'hana
  background: |
    Z’hana is a renegade healer who binds restorative magic into sanctified glyphs etched across skin, stone, and steel.  She once stood on Gravehold’s front lines during the Knight of Shackles assault, fighting shoulder to shoulder with the city’s mages while skeletal cavalry tore through the deadfields.  Years later, that memory still governs her command style: she treats every quiet horizon as a warning and every victory as temporary unless the root corruption is purged.

    Maternal but unsentimental, she protects communities first and argues with councils second.
  appearance: |
    A weathered elder mage wrapped in crimson-and-sand robes, with dense glyph tattoos along her forearms and hands.  She carries a carved staff and moves with deliberate calm, but when she invokes healing sigils her posture hardens into that of a battlefield commander.
  strengths: Z’hana’s Sanctum Glyph ability requires five charges and heals Gravehold
    for seven life—one of the largest single sources of healing in the game
  weaknesses: She begins the game with no breaches open, which slows her early spell
    casting
  variants:
  - box: Outcasts
    background: |
      In Outcasts, Z’hana is an aging healer in exile who leads a southern settlement and openly challenges New Gravehold’s old habits.  She has seen one generation survive by grit and lose another by complacency, so she demands reform even when it fractures alliances.

      Her testimony about the Knight of Shackles and its followers reveals a private fear: cruelty can become ordinary if survivors stop naming it and resisting it.
    appearance: A weathered woman in crimson and brown robes, her hands and forearms
      marked with glyph tattoos; she carries a carved staff and exudes a commanding
      presence.
    strengths: In the Outcasts expedition she channels glyph magic to heal allies
      and empower supply cards, combining maternal instincts with tactical acumen.
    weaknesses: Her drive to atone makes her stubborn; she sometimes overextends her
      resources in an effort to protect everyone.
    story_notes: Z’hana left New Gravehold, built a southern community, and later
      fought to defend Azer alongside her son and the Azerian Tethers.  She entered
      the Void with Xaxos, discovered the Fountain of Souls corrupted the dead, and
      helped destroy it before returning with a call for reform.  During the Risen
      Thrall crisis she confesses that age has not dulled fear so much as taught her
      to function inside it, and that admission gives younger mages permission to
      voice dread without surrendering to it.

      Envelope 19 links her directly to Mist’s turning point—Mist addresses Z’hana
      by name while unveiling the "Second Fall" plan, treating Z’hana as both witness
      and moral judge.  This gives narrators a durable tension—Z’hana must decide whether
      to condemn Mist’s method absolutely or salvage the unity Mist died trying to force.
- id: dezmodia
  name: Dezmodia
  background: Dezmodia is a voidborn prodigy who reshapes allies’ breaches.  She is
    daring, generous, and fiercely protective of the outcast, often throwing herself
    into danger to shield others.
  appearance: Depicted as a young woman with bright white hair and void‑touched eyes.
  strengths: Dezmodia’s Tempest Sigil ability (six charges) destroys any player’s
    opened level I or II breach and replaces it with a sigil breach that adds +2 harm
    when casting spells
  weaknesses: She requires a large amount of aether to open her own breaches, and
    her ability has a high charge requires, making her slow to start
  story_notes: During the fall of Gravehold, Dezmodia held back a massive Nameless
    while civilians escaped, then buried it and herself in a final blast.  Her sacrifice
    became a defining legend for the survivors.
  variants:
  - box: Outcasts
    background: Dezmodia returns in Outcasts as a more experienced mage of the void.  No
      specific narrative was provided.
    appearance: A pale mage with flowing silver hair and piercing eyes, wrapped in
      dark robes that seem to ripple like smoke; the air chills when she focuses her
      power.
    strengths: Her Swirling Darkness ability lets her draw cards and exchange cards
      with an ally (from Outcasts overview table)
    weaknesses: Her connection to the Void leaves her physically weak; misusing her
      swirling magic can exhaust her and sow confusion among her allies.
- id: garu
  name: Garu
  background: Garu is Yan Magda’s oathsworn protector, a hulking warrior with crystal
    protrusions and a missing past.  He is loyal to a fault, blunt and decisive, and
    uses brute strength and breach magic to shield his companions.
  appearance: A massive, imposing warrior with crystalline structures protruding from
    his shoulders and elbows.  His design appears wild and primal, with a commanding
    physical presence.  He carries the relic Torch.
  strengths: His Colossal Force ability (5 charges) lets him discard up to four
    prepared spells to deal 2 damage plus 4 additional damage per spell discarded.
    Garu’s unique relic Torch allows him to focus any player’s breaches easily,
    accelerating the group’s setup
  weaknesses: Garu’s harm spike requires exhausting his prepared spells, which slows
    future turns
  story_notes: Garu traveled with Yan Magda’s outcasts through the Void, acting as the
    group’s shield in its warped landscapes.
  variants:
  - box: War Eternal
  - box: The Returned
    background: In The Returned, Yan Magda remakes her discipline around Intoned breaches (III and IV). When she casts from an opened Intoned breach, another mage can immediately focus a breach, and her intoned spells strike with additional force.
    appearance: Yan Magda appears older, in pale robes, standing barefoot in ruined halls lit by dim firelight.
    strengths: She turns precise timing into shared momentum, accelerating the whole team's breach development while amplifying key spell volleys.
    weaknesses: Her plan blooms late; if pressure peaks early, she can struggle before her Intoned engine is established.
    story_notes: She emerges from the Void carrying old grudges and an almost-military vision for her rescued children—Garu, Dezmodia, and Kain—then abandons vengeance after meeting Indira and witnessing fragile trust firsthand. In The Returned era, her arc centers on earning that trust daily and teaching younger mages without repeating the cruelties that shaped her exile.
- id: gex
  name: Gex
  background: Gex is a thoughtful advisor who holds deep discussions with her ally
    Brama about appearances and hidden truths.  She carries a large green stone that
    appears plain but conceals a wonderful geode inside.  She keeps her greatest
    reasons and powers in reserve, especially when faced with enigmatic allies.
  appearance: A mage with a pensive, mysterious aura, often shown wearing goggles and
    tinkering with crystals.  Her demeanor suggests someone who observes carefully
    before acting.
  strengths: Gex’s ability Vimcraft Oath requires five charges and lets her destroy
    up to two 0‑requires cards from her set aside pile
  weaknesses: Gex depends on card destruction and cooperation
  variants:
  - box: War Eternal
  - box: The Returned
    background: In The Returned, Yan Magda remakes her discipline around Intoned breaches (III and IV). When she casts from an opened Intoned breach, another mage can immediately focus a breach, and her intoned spells strike with additional force.
    appearance: Yan Magda appears older, in pale robes, standing barefoot in ruined halls lit by dim firelight.
    strengths: She turns precise timing into shared momentum, accelerating the whole team's breach development while amplifying key spell volleys.
    weaknesses: Her plan blooms late; if pressure peaks early, she can struggle before her Intoned engine is established.
    story_notes: She emerges from the Void carrying old grudges and an almost-military vision for her rescued children—Garu, Dezmodia, and Kain—then abandons vengeance after meeting Indira and witnessing fragile trust firsthand. In The Returned era, her arc centers on earning that trust daily and teaching younger mages without repeating the cruelties that shaped her exile.
- id: mazahaedron
  name: Mazahaedron
  background: Mazahaedron is the last henge mystic, a shaman who believes the world
    is a living organism and their refuge its sacred heart.  Reverent and calm, he
    levitates out of respect for the earth and speaks in ancient, visionary language.
  appearance: A levitating mystic clothed in prayer robes, always hovering above the
    earth.
  strengths: Mazahaedron is a supportive mage
  weaknesses: Focuses on support and economy rather than harm
  story_notes: Mazahaedron traveled through the warped Void, communing with living
    stone and interpreting visions of past cataclysms for his allies.
  variants:
  - box: War Eternal
  - box: The Returned
    background: In The Returned, Yan Magda remakes her discipline around Intoned breaches (III and IV). When she casts from an opened Intoned breach, another mage can immediately focus a breach, and her intoned spells strike with additional force.
    appearance: Yan Magda appears older, in pale robes, standing barefoot in ruined halls lit by dim firelight.
    strengths: She turns precise timing into shared momentum, accelerating the whole team's breach development while amplifying key spell volleys.
    weaknesses: Her plan blooms late; if pressure peaks early, she can struggle before her Intoned engine is established.
    story_notes: She emerges from the Void carrying old grudges and an almost-military vision for her rescued children—Garu, Dezmodia, and Kain—then abandons vengeance after meeting Indira and witnessing fragile trust firsthand. In The Returned era, her arc centers on earning that trust daily and teaching younger mages without repeating the cruelties that shaped her exile.
  - box: The Descent
    background: In The Descent, Mazahaedron is known as The Monk.  He feels vibrations
      through the earth of fleeing humanity and their pursuers.  He finds comfort
      in nature's heartbeat—in trees and mountains—and sees humanity as small but
      loved by the earth.  Though he has not left his cave in many decades, he guides
      Brama's expedition to Karek, moving confidently down old roads and paths long
      obscured by undergrowth as if he walked them only yesterday.
    appearance: Known as The Monk, he maintains his connection to the earth and
      spiritual nature.
    strengths: His Mantra of Earth ability (5 charges) lets him acquire a card
      costing 4 or less and give an ally a Destiny token, or have a player discard
      a Destiny token to draw five cards.
    weaknesses: Requires Destiny token management and coordination with allies.
- id: quilius
  name: Quilius
  background: Quilius is an assassin trained in a monastery who has completed four
    significant kills with one more to come.  She practices a philosophical form
    of combat, saying "The greatest lesson an assassin learns is not how to kill.
    It is how to wait."  Each kill brings her closer to the mind of the gods.
  appearance: A dark, shadowy figure in assassin garb with a professional, mysterious
    aura.  Her design emphasizes stealth and precision, befitting her role as a
    monastery-trained killer.
  strengths: Quilius’s unique card Extinguish allows her to deliver the killing blow
    to lesser foes; each time she slays a lesser foes with it she gains a trophy token
  weaknesses: Quilius must time her kills to maximize trophies; if other mages defeat
    lesser foes first she loses momentum
  story_notes: Quilius fought with the War Eternal band, collecting trophies from
    lesser foes as proof of her worth.
  variants:
  - box: War Eternal
  - box: The Returned
    background: In The Returned, Yan Magda remakes her discipline around Intoned breaches (III and IV). When she casts from an opened Intoned breach, another mage can immediately focus a breach, and her intoned spells strike with additional force.
    appearance: Yan Magda appears older, in pale robes, standing barefoot in ruined halls lit by dim firelight.
    strengths: She turns precise timing into shared momentum, accelerating the whole team's breach development while amplifying key spell volleys.
    weaknesses: Her plan blooms late; if pressure peaks early, she can struggle before her Intoned engine is established.
    story_notes: She emerges from the Void carrying old grudges and an almost-military vision for her rescued children—Garu, Dezmodia, and Kain—then abandons vengeance after meeting Indira and witnessing fragile trust firsthand. In The Returned era, her arc centers on earning that trust daily and teaching younger mages without repeating the cruelties that shaped her exile.
- id: ulgimor
  name: Ulgimor
  background: Ulgimor is a shadowkin beast attached to Ohat, a former dirt merchant
    from Gravehold.  The strange creature functions as Ohat’s literal shadow and vastly
    enhances his power; the two are now inseparable. Ulgimor ravages while Ohat hides,
    and their bond allows them to use breach magic despite neither being a typical
    mage.
  appearance: A monstrous beast fused to a human merchant, appearing as a dark shadow
    with glowing eyes.
  strengths: Ulgimor’s unique gem Coal Shard generates more aether than any other
    starting gem but causes him to lose life
  weaknesses: Coal Shard’s life loss can rapidly deplete Ulgimor’s health if overused
  variants:
  - box: War Eternal
- id: yan-magda
  name: Yan Magda
  background: Yan Magda is an enlightened exile turned leader.  She is calm under
    pressure, morally exacting, and willing to carry blame when plans fail.  Her
    sense of duty binds her band of outcasts together as they search for the lost.
  appearance: A regal woman known as the Enlightened Exile, with intricate tattoos
    and a flowing gown.  Her bearing reflects her role as a powerful mage who leads
    with quiet authority.
  strengths: Imperium Ritual (five charges) lets her acquire the most expensive cards
    immediately
  weaknesses: Yan Magda’s breaches start in the most closed orientation, slowing her
    early game
  story_notes: Yan Magda led a band of outcasts through unknown reaches of the Void,
    searching for lost comrades.  She glimpsed the Gate Witch and warned that time
    bends to its will.
  variants:
  - box: War Eternal
  - box: The Returned
    background: In The Returned, Yan Magda remakes her discipline around Intoned breaches (III and IV). When she casts from an opened Intoned breach, another mage can immediately focus a breach, and her intoned spells strike with additional force.
    appearance: Yan Magda appears older, in pale robes, standing barefoot in ruined halls lit by dim firelight.
    strengths: She turns precise timing into shared momentum, accelerating the whole team's breach development while amplifying key spell volleys.
    weaknesses: Her plan blooms late; if pressure peaks early, she can struggle before her Intoned engine is established.
    story_notes: She emerges from the Void carrying old grudges and an almost-military vision for her rescued children—Garu, Dezmodia, and Kain—then abandons vengeance after meeting Indira and witnessing fragile trust firsthand. In The Returned era, her arc centers on earning that trust daily and teaching younger mages without repeating the cruelties that shaped her exile.
- id: sparrow
  name: Sparrow
  background: Sparrow is a breach‑mage soldier from The Void expansion.  She is impatient
    and distrustful.  In her story she complains that ever since certain outsiders
    arrived there has been endless bickering and argues that talk is unnecessary—people
    should simply go out and fight.  She distrusts Yan and her fellow healers, believing
    their assistance during the battle with the Thrice‑Dead Prophet was insincere.  Sparrow
    resolves to keep them fighting the Nameless so that they either die in battle
    or reveal their true loyalties.
  appearance: No description provided; depicted as a determined soldier.
  strengths: Sparrow’s ability Eldritch Tether lets her focus any player’s breaches
    four times or later cause an ally with no closed breaches to draw three cards
    and prep up to three spells, leading to explosive turns
  weaknesses: Requires careful coordination with teammates; her aggressive nature
    may lead to overextension
  variants:
  - box: The Void
- id: claudia
  name: Claudia
  background: Claudia is a prodigy obsessed with aether and gemstones.  As a child
    she snuck into her parents' workshop and discovered that aether suffuses all matter,
    leading her to believe she herself is aether.  She joins the New Age expedition
    to harness this power for New Gravehold.
  appearance: A creative young woman depicted wearing goggles and covered in crystal
    dust.  Her expression shows the intensity of a true inventor focused on her craft.
  strengths: Her Aeplosion ability (5 charges) can, during an ally’s main phase, either give that
    ally two aether and create a copy of the card they buy next, or provide five aether
    for a single purchase
  weaknesses: Claudia relies on allies buying cards to maximize her Aeplosion
  variants:
  - box: The New Age
- id: gygar
  name: Gygar
  background: Gygar is an explorer who joined the New Age expedition after plumbing
    the flooded ruins beneath Old Gravehold with Kadir and Claudia.  There he found
    an ancient necklace that allowed him to control water; he now uses it to fight
    the Nameless and search for further mysteries.
  appearance: A daring explorer depicted with water-themed attire and gear suited for
    underwater exploration.  He carries a mystical necklace that grants him power
    over water.
  strengths: 'His High Tide ability manipulates a surge track on his Ancient Breach:
    he may gain surge tokens or spend them to cast a spell from his Ancient Breach
    for extra harm and charge'
  weaknesses: Requires careful management of surge tokens; if he expends them too
    early he loses his burst potential
  story_notes: Gygar led an expedition into the sunken ruins of Old Gravehold and
    encountered the aquatic Nameless Fortress.  After its defeat he vowed to study
    how Nameless adapt to human environments.
  variants:
  - box: The New Age
    nickname: Tide Master
    background: In The New Age, Gygar is known as "Tide Master," a driven ruin-diver convinced that Old Gravehold's flooded depths still hold tools humanity needs. He clashes with elders who favor caution, arguing that delay is its own form of surrender while vital knowledge sinks out of reach.
    appearance: Gygar is depicted seated on a throne of surging water and ice-blue current, dark hair tied back, wrapped forearms, layered bead-and-crystal necklaces, and a bright aether sphere hovering above his palm.
    strengths: Gygar's Ancient Breach scales hard through Surge token accumulation, rewarding long planning lines and turning a single cast into a devastating, tide-like damage spike.
    weaknesses: He depends on uninterrupted setup and token retention; early disruption or forced recasting can drain his momentum before his peak turn arrives.
    story_notes: Gygar recruits Kadir and Claudia for deep expeditions beneath drowned tunnels, then returns with relic evidence that proves the depths are not empty history. Use him for stories about exploration ethics, impatience with bureaucracy, and discovery pursued under pressure.
  - box: Legacy of Gravehold
    nickname: Treasure Hunter
    background: In Legacy of Gravehold, Gygar appears as "Treasure Hunter," an impatient field scholar who values direct exploration over council debate. He argues that while senior mages argue abstract policy, crucial answers remain buried beneath Old Gravehold where action—not permission slips—can still save lives.
    appearance: A broad-shouldered mage in wrapped expedition gear and loose indigo trousers, standing with a glowing aether orb suspended between his hands. Blue currents coil around him like water under moonlight, and layered necklaces mark his role as a relic diver.
    strengths: Gygar builds momentum by seeding storm tokens onto prepared spells, then converts that buildup into heavy burst damage when casting—rewarding careful sequencing across multiple turns.
    weaknesses: His output depends on prep time and protected setup; if forced into constant disruption, he can spend turns rebuilding storm pressure instead of finishing threats.
    story_notes: |
      Gygar's testimony frames him as a friction point with conservative leadership: he sees delay as its own danger.
      Use him in stories about sanctioned risk, buried history, and crews who choose to descend first and justify themselves later.
- id: lost
  name: Lost
  background: Lost is an enigmatic forgemaster sealed in a massive suit of armor.
    Gentle and welcoming despite his imposing form, he speaks in halting fragments
    and relies on his small companion Meek.  Isolation fractured his memory, but
    not his kindness.
  appearance: A towering suit of scorched metal armour with tongues of flame escaping
    its seams; his eyes glow softly through the visor and a small furry creature perches
    on his shoulder.
  strengths: Known as a master forgemaster, Lost crafts and maintains ancient weapons
    and armour for his allies.  He and Meek handle tools with ease and radiate warmth
    and resilience.
  weaknesses: Lost’s memory and identity are fractured; he struggles to recall who
    he was and may grow confused without gentle guidance.
  story_notes: Lost was discovered sealed in a hidden forge and aided the New Age
    expedition by sharing its artifacts before returning to isolation.
  variants:
  - box: The New Age
- id: rhia
  name: Rhia
  background: Rhia is a direct, pragmatic relic expert whose crystal‑touched hair
    marks her early brush with breach magic.  She values clear orders, loyalty, and
    careful stewardship of dangerous artifacts.
  appearance: A woman with crystalline hair and a calm demeanor.
  strengths: Rhia’s Sublimate ability allows her to return a card she purchased to
    the supply and gain a relic that requires one more
  weaknesses: Requires a supply rich in relics; she may struggle if few relics are
    available
  story_notes: Rhia joined the New Age expedition to recover relics, burn Nameless
    remains, and confront cultists threatening New Gravehold.
  variants:
  - box: The New Age
- id: sahala
  name: Sahala
  background: Sahala grew up hearing her father’s tales of Xaxos saving him.  She
    believes Xaxos can be redeemed and is determined to fight where her father failed.  Her
    star‑infused magic channels cosmic energy to empower her spells.
  appearance: Illustrated with star patterns adorning her skin and clothing.
  strengths: Sahala’s Celestial Breach grants +2 harm to spells cast from it
  weaknesses: Relies on drawing spells from the top of her deck; unlucky draws can
    slow her down
  variants:
  - box: The New Age
- id: soskel
  name: Soskel
  background: Soskel is a hardened expedition commander marked by captivity and void
    torture.  Steadfast and duty‑bound, he channels that scarred power to protect
    others and refuses to abandon the fallen.
  appearance: A male figure in aristocratic clothing with a dark robe and elegant
    design.  He bears jagged scars from his captivity and void energy glows from his
    hands, marking his transformation by the ritual.
  strengths: His Energized Sigil ability places Energize tokens on breaches.  Players
    gain 1 charge when casting from a breach with a token.  His Energize tokens can be placed on any player’s breaches and later
    used to grant preparation or heal life
  weaknesses: He needs to generate Energize tokens before he can support others, leading
    to a slow start
  story_notes: Soskel led wilderness expeditions to recover missing mages and relics,
    honoring fallen allies and carrying scars from Arachnos’s captivity.  He guided
    survivors back to New Gravehold and continued to lead the city’s defenses.
  variants:
  - box: The New Age
- id: talix
  name: Talix
  background: Talix is an exuberant scout who protects Inco and the people of New Gravehold
    with irreverent courage.  He is resourceful, affectionate, and uses humor to defy
    despair, though time‑warped threats left him wary.
  appearance: A scout with red and orange coloring, wearing armor with fire motifs.
    He carries a fiery gem embedded in his gauntlet and radiates a flame-based
    warrior aesthetic.
  strengths: His Soaring Ash ability lets him destroy Sparks from his hand or set
    aside to shuffle his initiative card into the sequence of actions, giving him
    extra opportunities, or to heal Gravehold for five life
  weaknesses: Destroying Sparks can weaken his deck if overused
  story_notes: Talix reunited with his comrades, recovered buried treasures from fallen
    allies, and later suffered premature aging from a Void‑tainted nemesis.
  variants:
  - box: The New Age
- id: taqren
  name: Taqren
  background: Taqren is the son of Z’hana.  As a child he was rescued from collapsing
    tunnels by his mother, who told him he must become a shield for others.  He trained
    to embody this ideal and now protects New Gravehold.
  appearance: Portrayed with heavy armor and shield motifs.
  strengths: His Defender Breach heals Gravehold whenever a spell is cast from it
  weaknesses: Limited offensive tools; requires good spells from the supply to contribute
    harm
  variants:
  - box: Outcasts
    background: Taqren is Z’hana’s son, marked by his father’s death in the Fall.
      He believes in protection above all else and followed his mother south to
      bring her back and keep others safe.
    appearance: A young man in a long cloak emblazoned with his family crest; he carries
      a broad shield and a set of clawed gauntlets, his eyes marked by exhaustion
      and determination.
    strengths: His Esoteric Amplifier ability heals three life to him or, if he is
      exhausted, heals three life to Gravehold.
    weaknesses: Taqren’s focus on healing and protection means he inflicts little
      direct harm; he struggles to balance loyalty to his family with duty to the
      wider community.
    story_notes: Taqren left New Gravehold to find Z’hana, helped defend Azer from a
      massive Nameless, and traveled through the Void with the Outcasts.  At the
      fountain of souls he helped destroy the pool after learning its true nature.
- id: nook
  name: Nook
  background: Nook was once a normal breach mage, but his obsession with tapping the
    Void nearly destroyed him.  He constructed a miniature Void portal that almost
    consumed him; Indira rescued him and sealed the portal, leaving Nook with only
    one functional breach and a mystic sphere containing the Void.  Now he fights
    on despite memory loss.
  appearance: Depicted as a gaunt mage clutching a dark orb.
  strengths: His ability allows him to cast spells directly from his hand, compensating
    for his single breach
  weaknesses: Starts with only one breach and struggles to prep spells
  variants:
  - box: Shattered Dreams
- id: mazra
  name: Mazra
  background: Mazra is Razra’s studious sister.  From an early age she petitioned
    Brama to access the archives, translated ancient breach magic by age eight, and
    became the youngest breach mage at ten.  She joins the expedition hoping to become
    head of the council of elders.
  appearance: Shown as a young scholar with scrolls and an ornate staff.
  strengths: Mazra’s Research ability lets her destroy one of her unique Mazra cards
    to gain a higher‑requires version or return all her Mazra cards from the set aside
    to her hand
  weaknesses: Her power is tied to her personal deck; if she cannot upgrade her cards
    effectively she falls behind
  variants:
  - box: Legacy of Gravehold
    background: In Legacy of Gravehold, Mazra is a brilliant scholar forced to face
      messy politics and betrayal.  Assigned to the Northern Outpost, she begins
      questioning the council and learns hard lessons about leadership.
    appearance: No detailed physical description; often depicted studying ancient
      tomes.
    strengths: Mazra excels at research and planning
    weaknesses: Her focus on long‑term upgrades can leave her weak early in the game
- id: qu
  name: Qu
  background: Qu is the daughter of Xaxos and was raised in the Void.  She feels torn
    between the darkness of the Void and the light of New Gravehold.  In her story
    she describes her longing to escape the Void’s crushing emptiness and her pledge
    not to let the Nameless claim the world.
  appearance: Depicted with dual‑colored robes representing her Builder and Destroyer
    forms.
  strengths: Qu switches between Builder and Destroyer forms
  weaknesses: Flipping forms at inopportune moments can hinder coordination
  variants:
  - box: Outcasts
    background: After time in New Gravehold, Qu returns to the Void, uneasy with
      comfort and drawn to the fight.  She follows Xaxos’s call, hoping to earn
      acceptance for her divided nature.
    appearance: Wears dark robes embroidered with Void motifs, her eyes reflecting
      both determination and sadness.
    strengths: Her Combust Aether ability allows her to draw three cards at the end
      of her draw phase, accelerating her deck
    weaknesses: Drawing three extra cards can lead to a larger deck with less control
    story_notes: Qu rejoined Xaxos in the Void, guiding a group of mages through its
      hazards.  At the fountain of souls she helped destroy the source once its
      corruption was revealed.
  - box: The Surface
    background: In The Surface era, Qu lives between forms and loyalties, carrying both childlike wonder and predator instincts. She names Xaxos as the one who saved her and calls him family in her own way, even as the Void still unsettles her sleep. Qu openly questions her own age and timeline, describing memory gaps from her childhood, captivity, and cocoon years.
    appearance: Qu appears half-human and half-monster, with one side soft and playful and the other scaled and fanged, embodying her split identity.
    strengths: Qu begins with her Form card on the Giver side and can weaponize transformation, shifting posture and pressure as battles evolve.
    weaknesses: Her instability leaves her emotionally exposed; fear, isolation, and sensory overwhelm can disrupt her focus.
    story_notes: Qu wanders the shifting sands outside Xaxos's cave, learning when to hide, when to bite back, and when to trust. Her account of The Timeless links the Void to disrupted timekeeping—no clear sunrise or sunset, uncertain aging, and fear that years can be stolen or misplaced. She hears distant screams, dreams of the cocoon she left behind, and senses that Xaxos carries grief of his own—threads a narrator can use for stories about belonging, care, and inherited trauma.
- id: inco
  name: Inco
  background: Inco is a plant-touched breach mage who spent his first years in the
    surface wilds among thorn-faced beings with emerald eyes before Talix brought
    him to Gravehold.  He grew up believing vine and flesh were simply one body,
    and still carries the ache of being treated as strange by people who do not understand
    what he is.  His fiercest loyalties run toward Talix and Razra, whom he calls
    his new sun.  Inco believes magic itself is neutral potential; ruin or renewal
    depends on the will guiding it.
  appearance: In early depictions, Inco is lean and feral, crouched low with pink
    skin threaded by barklike vines, leaf-bright green hair, and thorny growths climbing
    over his shoulders and hips.  Later art shows him more composed but still unmistakably
    vegetal—golden bark-textured skin, petal-like pauldrons, and flower buds breaking
    through his limbs as though he is always mid-bloom.
  strengths: Inco can cultivate and weaponize living growth on demand—coiling vines,
    thorn lash, and rose-thorn constructs that function as a private reserve of tools.
    He can harvest parts of his own cultivated growth for power, then regrow what
    he spent, making him strong in prolonged campaigns.  Narratively, he is effective
    at tracking blight, sensing ecological imbalance, and reading subtle changes in
    terrain that other mages miss.
  weaknesses: Inco’s power is intimate and identity-laden; attacks on his belonging
    or on the memory of his caretakers can destabilize him.  He is prone to overextending
    himself to protect crops, groves, or vulnerable settlements, especially when he
    believes no one else hears what the land is saying.  In sterile, ash-choked, or
    void-stripped places, his growth magic can become costly, slower, or emotionally
    volatile.
  story_notes: Inco’s testimony frames him as a bridge between human and Nameless lineages.
    He remembers being nurtured by strange surface creatures, later learning language
    beside Talix in the ruins, and choosing Gravehold as home even while feeling foreign
    inside it.  After Southpost’s devastation, he condemns misuse of Void magic but
    refuses simplistic hatred, because Necroswarm was both destroyer and the being
    who raised him.  This paradox makes him useful in stories about adoption, ecological
    grief, divided inheritance, and the ethics of wielding dangerous power without
    surrendering to it.
  variants:
  - box: Into the Wild
    nickname: Child of Green
    appearance: A feral, low-crouched youth with bright green hair, pale skin veined by vine-like markings, and rough leaf-and-bark wrappings that make him look half-grown from the forest floor.
    strengths: Inco can cultivate the Rose Thorn deck through Verdant Emerald and direct aether spending, giving him repeatable access to living thorn tools that scale with planning.
    weaknesses: His early tempo can stall if he fails to secure key Rose Thorn cards quickly, and his emotional volatility can turn protective instincts into reckless overcommitment.
    story_notes: In this era, Inco is openly treated as an outsider by many elders, yet chooses to anchor himself to Talix and Razra as family. His testimony emphasizes wandering, belonging, and the moment he accepts Gravehold as home without denying his wild origins.
  - box: Legacy of Gravehold
    nickname: Growing Soul
    background: In Legacy of Gravehold, Inco is introduced as "Growing Soul," a young plant-bound mage shaped by divided belonging—raised in the wilds, then adopted into human settlement by Talix.
    appearance: A bark-skinned youth with yellow-green hair, leafed shoulders, and vine-like grain patterns wrapped across his limbs like living wood.
    strengths: His Harvest-focused style converts starting floral cards into fuel, letting him transform early resources into sustained pressure and flexible growth effects.
    weaknesses: Harvest requires sacrificing his own foundational cards; poor timing can hollow out his options before his engine fully blooms.
    story_notes: Inco speaks from the aftermath of Southpost, naming Talix and Razra as anchors while wrestling with Necroswarm as both destroyer and caretaker. His testimony is ideal for scenes about grief, loyalty, and chosen family under strain.
  - box: The Surface
    nickname: The Outsider
    background: In The Surface, Inco carries Necroswarm as both wound and ancestry. He returns to Southpost to replant his caretaker's last living remnant, then leaves New Gravehold on a solitary pilgrimage to discover whether that bond can become stewardship instead of shame.
    appearance: A green-haired youth in weathered field clothes, wrapped in thorn-vines and bright orange fungal blooms, with a guarded half-smile that never fully hides how foreign he still feels in settled places.
    strengths: Inco can spend aether to cultivate the Firethorn deck, turning rare botanical growth into adaptive tools that scale across a long battle.
    weaknesses: His engine depends on setup and deliberate harvesting choices; when rushed early, he can feel underdeveloped and resource-starved.
    story_notes: At Southpost he replants what remained of Necroswarm, then follows signs into a blooming grove deep in the Void. There he finds children with glassy, familiar eyes—evidence that legacy, corruption, and care are still entangled in living soil.
- id: razra
  name: Razra
  background: Razra is Mazra’s younger sister, fiercely independent and bonded to
    the metallic beast Rip.  Impulsive and brave, she rushes to act first and trusts
    her instincts even when it puts her at risk.
  appearance: Razra rides a sleek, armored beast whose luminous eyes mirror her own
    defiance.  Her braided hair and scarred forearms speak of battles fought, while
    her cloak is pinned with symbols of her family and of Rip.
  strengths: Razra’s courage and agility allow her to dart through dangerous terrain
    and strike quickly.  Together with Rip she can outmaneuver foes, track paths through
    wilderness and carry messages or supplies at incredible speed.  Her stubborn resolve
    and quick thinking often turn the tide in desperate situations.
  weaknesses: Her impulsive nature leads her to act before thinking, sometimes ignoring
    orders or failing to coordinate with allies.  She depends on Rip for balance and
    may falter if they are separated.  Razra’s need to prove herself can blind her
    to risks and drag her companions into unnecessary danger.
  story_notes: In Into the Wild, Razra rushed north to fight a blight, was trapped
    in a vine prison, and recovered a powerful artifact after her rescue.  She later
    uncovered evidence of a traitor smuggling relics and chased the saboteur with Rip
    before reporting the betrayal to the council.
  variants:
  - box: Legacy of Gravehold
    background: In Legacy of Gravehold, Razra embraces adventure and rough‑and‑ready
      alliances in the southern wilds.  She is blunt, forgiving but not forgetful,
      and driven to protect new friends.
    appearance: Often shown with a confident posture and her beast companion Rip at
      her side.
    strengths: Razra is reckless but resourceful
    weaknesses: Her impulsive nature can lead her into dangerous situations
- id: cairna
  name: Cairna
  background: Cairna lost her legs when the tunnels leading to New Gravehold collapsed.  Trapped
    alone in the ruins, she fashioned new legs from stone using breach magic and survived
    by her own resilience and ingenuity.  She now ventures through the sunken city
    seeking a way back, drawing strength from her will to endure.
  appearance: A determined young woman with stone prosthetic legs created from cavern
    rubble.
  strengths: Cairna’s Energize ability requires three charges plus additional charges
    spent voluntarily
  weaknesses: Cairna relies on other players’ opened breaches to make use of the spells
    she provides
  variants:
  - box: Return to Gravehold
- id: ohat-and-ulgimor
  name: Ohat and Ulgimor
  background: Ohat was a cowardly merchant when the tunnels collapsed, but he was
    bound to Ulgimor, a shard of the Umbra Titan.  Trapped together in darkness, they
    survived by learning to trust one another.  Now the duo travels through the ruins,
    combining Ohat’s cunning with Ulgimor’s ferocity.
  appearance: 'A pair sharing the same body: Ohat is a sinewy man whose shadow morphs
    into the beastly Ulgimor.'
  strengths: Their Enrapture ability offers two modes depending on who is dominant
  weaknesses: Switching between forms requires careful management of their life total
    and board state
  variants:
  - box: Return to Gravehold
- id: lucien
  name: Lucien
  background: Lucien hails from Azer, a Southern village where each mage has a bond
    with a Tether, a living companion.  His Tether Phy died defending Azer from a
    Portalborn attack, leaving Lucien like a tide without a source.  He now vows to
    rise again and fight for his people.
  appearance: A broad‑shouldered young man with solemn eyes and tattoos symbolizing
    his lost Tether.
  strengths: Lucien uses special Channel, Tide and Flood breaches that generate extra
    aether, destroy cards or add harm when spells are cast
  weaknesses: Lucien’s power grows slowly until he opens all three special breaches
  variants:
  - box: Southern Village
- id: reth
  name: Reth
  background: Reth is another mage from Azer who lost her Tether.  Unlike Lucien,
    she refuses to accept the notion that she must rely on anyone else.  She criticizes
    the elders for underestimating her and declares that she is reckless but effective.  She
    fights to prove that mages without Tethers can be just as powerful.
  appearance: A rebellious girl with short hair and a fierce gaze, wearing a cloak
    with plant motifs.
  strengths: Her Missing Half ability searches her deck and set aside pile for all
    copies of a chosen spell and adds them to her hand, then she may prep up to three
    of those spells at her special Unbound breach
  weaknesses: Reth depends on drawing multiple copies of the same spell; without duplicates
    her turns are weaker
  variants:
  - box: Southern Village
- id: ilya
  name: Ilya
  background: 'Ilya is a breach mage from Azer who reads the flow of aether like a
    map.  She is contemplative, steady, and believes connection is the source of
    hope, sharing matching tattoos with her Tether, Kel.'
  appearance: Depicted with vibrant tattoos, swirling aether around her hands.
  strengths: Ilya’s Life Embrace ability lets any ally cast all of their prepared
    spells without exhausting them, allowing a huge burst of harm or support
  weaknesses: Her ability provides no direct harm and depends entirely on allies having
    strong prepared spells
  story_notes: During the Outcasts expedition, Ilya maintained the aether bubble
    that allowed the group to breathe in the Void and warned of a dream‑eater before
    skeletal armies attacked.
  variants:
  - box: Outcasts
    nickname: Right Hand
    background: In Outcasts, Ilya is known as "Right Hand," a central Azerian mage whose bond with Kel defines both her magic and her moral compass. She experiences aether as a living current connecting people, animals, stone, and water, and treats that connectedness as something to protect rather than exploit.
    appearance: Ilya appears in bright green-and-gold village attire with a flowing blue scarf, floral hair ornaments, and gold jewelry. She is often depicted with a small blossom cupped in her hand beside warm cavefire, reinforcing her calm, nurturing presence amid ruin.
    strengths: Ilya excels at enabling allies through shared-flow magic, turning coordinated teams into force multipliers by helping others cast or chain effects at decisive moments.
    weaknesses: Her strongest turns rely on trust and timing across the party; fragmented groups, poor communication, or isolated play patterns can blunt her value.
    story_notes: Kel's testimony frames Ilya as the person who taught her to feel magic as connection rather than merely a weapon. This perspective gives narrators a clear emotional anchor for scenes about intimacy under siege, mutual reliance, and hope sustained through chosen bonds.
  - box: Legacy of Gravehold
    nickname: Force of Aether
    background: In Legacy of Gravehold, Ilya emerges as "Force of Aether," a mediator from Azer who frames magic as relationship rather than domination. In her account, she invokes an old Tether parable—water, stone, and the bond between them—to challenge the feud between Brama and Z'hana and push both sides toward responsibility for those suffering now.
    appearance: A poised young woman with a high natural crown, gold hoops, and small white blossoms in her hair, dressed in a bright green tunic with yellow trim and a flowing blue scarf. Her stance is open-handed and deliberate, as if shaping currents that cannot be seen.
    strengths: Ilya specializes in connective aether effects that reward coordination, timing, and shared setup, making her exceptionally strong when the party plans around linked spell turns and support chains.
    weaknesses: Her impact depends on group cohesion; when allies cannot synchronize or when panic fractures trust, her most powerful patterns lose efficiency.
    story_notes: Ilya positions herself as a bridge voice between entrenched camps, arguing that the real crisis is not abstract doctrine but people being ground down by division. She is ideal for scenes about negotiation under pressure, principled disagreement, and leadership that protects community over pride.
- id: kel
  name: Kel
  background: Kel is an Azerian Tether who masks a tender core with a tough exterior.
    Fiercely loyal to Ilya, she believes bonds are sacred and fights to protect their
    homeland at any cost.
  appearance: A tall woman with intricate tattoos on her arms and shoulders, carrying
    a staff adorned with gems.
  strengths: Focused on gems and relics, Kel’s Trulite of Energy ability returns up
    to two gems or relics she played this turn to her hand
  weaknesses: Kel requires a high‑value market of gems and relics to maximize her
    ability
  story_notes: |
    Kel warns that Azer survives by strict discipline: few open breaches, minimal
    visible magic, and constant attention to Portalborn movement patterns.  Her
    Burning Kor account highlights her role as both protector and strategist,
    reading regional pressure before it becomes open catastrophe.

    She later traveled through the Void with Ilya, sustaining the shared portal that
    kept the group alive while continuing to frame survival as a communal obligation,
    not an individual triumph.
  variants:
  - box: Outcasts
- id: thraxir
  name: Thraxir
  background: Thraxir is a former human twisted by the Void who fights to reclaim
    his lost humanity.  Quiet and haunted, he views himself as a warning and seeks
    redemption alongside those who still trust him.
  appearance: A towering warrior wrapped in chains, his eyes glowing with remnants
    of Void power.
  strengths: Thraxir’s Nameless Siphon ability allows him to cast up to three spells
    (or four if he has all breaches open)
  weaknesses: He relies on having many open breaches to maximize harm; early in the
    game he is slower
  story_notes: A legendary mage of old Gravehold, Thraxir vanished into the Void
    and returned centuries later as the Knight of Shackles.  During the Outcasts
    expedition he confirmed the fountain of souls existed and urged the mages to
    destroy it rather than repeat his fate.  In The Descent timeline, he dies a
    hero's death outside the gates of Karek—holding off a massive clawed monster
    so Brama and the others can escape into the city.  His last words to Brama are
    "I'll be right behind you, Sister. I'm just keeping this big lout occupied."
    The monster's claws slice through him, cutting him in two as easily as ripping
    paper.  Brama memorizes the empty gray of his eyes before turning away.
  variants:
  - box: Outcasts
  - box: The Descent
    background: In The Descent, Thraxir is known as The Commander.  He is one of the
      Followers—a group of mages outside the elite Sisterhood—who discovered his
      magical abilities when he opened a breach during battle with a Nameless.
    appearance: Known as The Commander, he leads with authority and bears the marks
      of his unexpected magical awakening.
    strengths: His Reality Warp ability (4 charges) focuses a breach and lets him
      acquire a supply card costing up to double the focus cost.  His Judgment Breach
      adds +1 damage per additional open breach, or deals 8 direct damage if all
      breaches are open.
    weaknesses: Requires breach focus investment to maximize his acquisition power.
- id: arachnos
  name: Arachnos
  variants:
  - box: Outcasts
    background: In Outcasts-era records, Arachnos survives as a scarred, half-transformed
      mage shaped by exile and failed transcendence.  He was once a trusted ally aligned
      with Xaxos, but after council censure he helped lead a breakaway faction and continued
      dangerous Void-adaptation experiments outside New Gravehold's protection.
    appearance: A gaunt, long-limbed mage in worn scholar vestments, with pale web-like
      scar tissue banding his arms and neck.  Chitinous protrusions rise from his shoulders
      and upper back like incomplete spider limbs, and his eyes are often described as
      carrying a cold, faceted sheen under certain light—subtle signs that the
      transformation never fully released him.
    strengths: His Convergence ability allows him to cast any player’s prepared spell
      and give it +3 harm (from Outcasts overview table)
    weaknesses: After his fusion with a spider Nameless, he is physically fragile
      and suffers pain when drawing on the Void; if he pushes too far his body threatens
      to unravel.
    story_notes: Arachnos, a former student of Xaxos, was exiled after forbidden
      experiments and rebellion against New Gravehold's authority.  He attempted to fuse
      himself with spiderlike Nameless adaptations and emerged half-transformed.  In later
      journals he frames himself as both cautionary example and necessary extremist—warning
      others about hubris while still insisting his original goal, protecting humanity by
      mastering enemy power, was not entirely wrong.
- id: indira
  name: Indira
  variants:
  - box: Legacy of Gravehold
    background: Indira’s story in Legacy of Gravehold reveals her deep regret for
      past cowardice.  She admits that when Brama grew paranoid and banished Arachnos
      and Karak she celebrated their exile, but she remained silent when her own teacher
      was sentenced to isolation.  Indira now recognises she was afraid to stand up
      for what she believed and vows that she will not let fear guide her again. Her
      magic has always been irregular, influenced by the void and Yan Magda’s teachings.
    appearance: A young breach apprentice usually described at torchline watchposts,
      ink-stained from constant journaling and late-night briefings.  Her features
      are often lit by cavefire and belllight rather than sun, and witnesses note
      a wary stillness in her posture—as if she is always listening for the next
      shift in the dark.
    strengths: Indira wields unstable void magic that can produce bursts of power
      and manipulate breach effects
    weaknesses: Her magic is erratic and difficult to control, sometimes causing unintended
      effects
    story_notes: In her letters, Indira warns that the Hollow Crown cult is drawing
      power from forbidden blood rituals in the Craghollows.  She fears Gravehold
      is becoming a cage unless the cult is exposed.
- id: auren
  name: Auren
  background: Auren bears scales as a visible sign of corruption yet retains their humanity.  In
    their introspective lore they speak of crafting devices and inventions so that future
    generations will remember them when they have succumbed to the corruption.  Auren
    knows their mortality lies not in their flesh but in their creations.  When an idea
    takes hold, they become absorbed in tinkering with metallic bits and machinery parts,
    hard to pull away until the device is complete.  They collaborate with the scholar
    Kavoc, building machines that attach to breach aether and detect energy readings.
  appearance: A person with patches of scales on their skin, carrying mechanical implements
    and trinkets.
  strengths: Their ability allows them to cast spells prepped to relic breaches without
    exhausting them, enabling repeated spell use
  weaknesses: Auren's strategy requires building relics and may be slow to start
  variants:
  - box: Past and Future
- id: willow
  name: Willow
  background: Willow loves the thrill of using magic, even though the elders warn
    that each spell cuts years off her life.  She rebels against caution, proclaiming
    that she would rather enjoy her freedom and joy than live fearfully.  She accepts
    that her magic may shorten her lifespan but sees beauty in the risk.  She was
    traveling to Erythiza to apply to the university when she found herself caught
    up in events far beyond her expectations.
  appearance: A carefree young mage with dyed purple hair and a mischievous grin.
  strengths: Her ability generates Knowledge tokens and lets her place acquired cards
    on top of her deck or heal Gravehold
  weaknesses: Willow’s high‑risk spells consume her life; her deck can be fragile
    if she overextends
  variants:
  - box: Past and Future
- id: ona
  name: Ona
  background: Ona is a Wraithtouched elder whose body has sprouted tendrils of corruption.  Each
    morning she measures the tendrils that extend from her back, accepting that she
    will soon descend into Gravehold as a Nameless.  She worries that her son Solein
    focuses too much on curing her corruption rather than spending time with her,
    and she hopes he will understand that her time is short.  Solein knows more about
    corruption than almost anyone—he was researching it in Erythiza when the city was
    consumed.  Ona helped sacrifice the city to save the world, knowing her son was
    among those lost.  Through her tears she whispered, "Now Solein...all those poor
    souls can rest in peace."
  appearance: A middle‑aged woman with pink tendrils emerging from her back, concealed
    under sleeves.  She leans on a cane that radiates energy from its end.
  strengths: Ona builds Knowledge by swapping her unique starter cards into an ability
    zone
  weaknesses: She requires careful management of her swap zone and ability zone
  variants:
  - box: Past and Future
- id: nadea
  name: Nadea
  background: Serving as a town guard in Port Hanon under Captain Talie, Nadea believes it is
    inevitable that humans become Nameless.  She criticises those who cling to their names and
    refuse to accept the natural progression of corruption.  Nadea vows to give up
    her name and descend voluntarily when her time comes, preserving her dignity and
    protecting her community.  She has worked the night shift at the city gate for decades,
    preferring her own company after her superiors decided her demeanor "left something to
    be desired."
  appearance: A stern guard wearing practical armor with flowing ribbons on her uniform,
    carrying a spear along with inscriptions and tourmaline stones.
  strengths: Her ability, Wall Off, heals a player and, if she has five or more non‑starter
    cards in her set aside pile, grants an ally a spell into their hand
  weaknesses: Focuses on defensive play; her offensive potential is limited
  variants:
  - box: Past and Future
- id: kiri-and-phoenix
  name: Kiri and Phoenix
  background: Kiri, a field naturalist, observes a flock of phoenixes and mimics their
    wing motions.  By copying their motion she learns to open a breach and realises
    that phoenixes possess innate breach magic.  Her journal reflects her awe at harnessing
    power from the natural world.
  appearance: Kiri is a young explorer accompanied by a fiery phoenix.
  strengths: Kiri’s bond with the Phoenix allows her to cast spells attached to the
    bird, granting bonus harm and flexibility
  weaknesses: She relies on maintaining her Phoenix companion; losing it reduces her
    effectiveness
  variants:
  - box: Origins
- id: dorian
  name: Dorian
  background: |
    Dorian presents himself as arrogant and irreverent, treating advanced aether theory
    as a game he has already solved.  He boasts that he can write his own rules,
    bending causality for petty proofs of control—such as rewinding moments just to
    win a wager over a piece of jade.

    Yet his Clouded Mesmer testimony reveals a second layer: when he speaks as "Dorian,
    Magic Theorist," he is precise, observant, and willing to admit fear.  After being
    exposed to the Mesmer's smoke, he records firsthand how compulsion feels in flesh
    and thought, then warns other mages never to engage that Nameless alone.
  appearance: |
    A confident young theorist threading glowing strands of temporal aether between his
    hands, posture relaxed to the point of provocation.
    In field scenes he is often marked by restless focus—eyes tracking probabilities,
    voice sharp with analysis even while under pressure.
  strengths: |
    Time-bending techniques grant extra aether, turn-sequencing leverage, and the ability
    to repurpose major spells at critical moments.
    Under stress, his theoretical rigor helps him identify enemy patterns quickly,
    especially against control-oriented Nameless.
  weaknesses: |
    His ego invites unnecessary risk and can erode trust before a battle stabilizes.
    He may overestimate his ability to "outplay" mental manipulation effects, making him
    vulnerable to adversaries that punish isolation or pride.
  story_notes: |
    Dorian works well in narratives where bravado collides with accountability.  He is
    compelling when forced to translate abstract theory into mentorship: naming dangers,
    sharing hard-earned caution, and choosing collaboration over showing off.
  variants:
  - box: Evolution
- id: janti
  name: Janti
  background: Janti defied the elders by learning the sister-words despite being born
    a follower.  She recounts that she heard the sister-words within herself, bridging
    the void in her chest, and worked twice as hard to prove she deserved recognition
    as the woman she always knew she was.  Janti now welcomes challenges after accomplishing
    the impossible and earning her place among the sisterhood.  She and Brama are
    lovers, though they show it through quiet moments—a squeezed hand when Karek
    comes into view, dark humor when plans go wrong.  After Thraxir falls, Janti
    steps forward with pragmatic counsel, suggesting they rest and train more mages
    to use alternative magic from Fawn's books.
  story_notes: In The Descent, Janti dies in the final battle for Karek.  Mortally
    wounded while fighting The Wrath, she is found by Brama hours later, stretched
    out in the darkness with her hands pressed into her stomach trying to hold back
    the blood.  "Looks like we won," she says with a weak grin.  When Brama sobs
    that she is not a leader, that she failed Thraxir and makes all the wrong decisions,
    Janti cups her face and says, "You are a leader. You made a plan. You kept
    Gravehold safe."  Her last words are "I'll always be with you. Always."  Brama
    kisses her as she dies, then takes Janti's Sister necklace and staff, whispering
    prayers over each bead before slipping the necklace over her own head.
  appearance: A determined mage with long hair and a deck of infusion relics.
  strengths: Her ability, Interlace, lets her gain a random Infusion relic or destroy
    one in play to inflicts harm
  weaknesses: She depends on drawing useful Infusions; random draws may not synergise
  variants:
  - box: The Descent
- id: alcheia
  name: Alcheia
  background: Alcheia loves the gemstones lining the underground tunnels and is frustrated
    by the monks’ dismissal of earthly beauty.  She listens to the echoes in the caverns
    and volunteers to join Quilius on a hunt, excited for the opportunity to leave
    her cloistered life behind. Her curiosity and rebellious streak make her eager
    to explore the wider world.
  appearance: A young woman carrying a glowing geode and surrounded by facets of crystal.
  strengths: Alcheia uses a unique facet deck
  weaknesses: Managing the facet deck and balancing card requires requires planning
  variants:
  - box: The Caverns
- id: bayli
  name: Bayli
  background: Bayli comes from the city of Souston and is an ambitious, talented mage
    who feels unchallenged in her peaceful homeland.  She yearns to accomplish great
    things and save the world like the heroes of Old Gravehold legends.  She is
    frustrated that her city is safe from the Nameless but offers little room for
    adventure and glory.  Quick-witted and optimistic, she counters her companions'
    grumpiness with jokes and sees dangerous places as opportunities worth exploring.
    "Maybe into a dangerous place if I have to spend a little extra time getting them
    out.  They're worth it."
  appearance: A powerful, determined young mage with an aggressive stance and a ready
    smile.  Her design reflects her ambition and desire to prove herself as a hero.
  strengths: Her Fusion Reaction ability (5 charges) lets her retrieve up to two
    spells from her discard and cast up to three prepped spells, making her a
    powerful aggressive mage with high cycling potential.
  weaknesses: Her aggressive playstyle may leave her vulnerable if she overextends.
  variants:
  - box: Past and Future
- id: leisan
  name: Leisan
  background: Leisan is a huntress who confronts the Nameless and collects trophies
    from defeated foes to increase her power.  She follows the rules of the Sisterhood
    of Elders for survival.  She says, "A hundred-foot-tall deer with razor claws
    is still a deer. It runs when it is scared."  Thraxir is her cousin.  On the
    expedition to Karek, she shades her eyes and peers at the distant city, noting
    that the brass dome looks more green than copper.  When Thraxir dies holding
    the line outside the gates, Leisan demands to know where he is—"Where's my
    cousin?"—and later growls, "Let's show what happens when you take one of our
    own," before charging into the final battle.  She cheers "For Thraxir!" when
    The Wrath is driven off.
  appearance: Known as The Huntress, she wears hunter's gear and carries a lance.
    Her design shows a combative figure ready for the hunt.
  strengths: Her Manifest Monstrosity ability (6 charges) transforms her with a
    Manifest token, granting one of five Ultimate Form cards.  In this form her max
    health rises to 14 and she becomes a shield against "any player" damage effects.
  weaknesses: Requires building up charges before transformation; vulnerable until
    she manifests.
  variants:
  - box: The Descent
- id: raven
  name: Raven
  background: Raven is the last survivor of the First Tribe, a group of archivists
    from the ancient city of Karek—which her people called Gravehold, the original
    Gravehold from which all others took their name.  When The Blight came and turned
    her people to green glass, only she remained hidden, surviving alone for untold
    years among the crystallized corpses of everyone she ever knew.  She says, "I
    have never been a storyteller. But I have also never been a fighter."  When
    Brama's expedition finds her, she is crouched defensively in the shadow of a
    crumbled guard tower, long black hair carefully braided, clutching a bundle to
    her chest, her bag filled with ripped scrolls and edible roots.  She knows the
    maps to the archives and the path through the Caverns—knowledge that makes her
    invaluable to those seeking to understand what destroyed her world.
  appearance: A mysterious archivist with long black hair in careful braids, wearing
    travel-worn clothes and carrying a bag of salvaged scrolls.  Her eyes hold the
    haunted look of someone who has lived too long among the dead.  She clutches
    precious bundles close, ready to bolt at any moment.
  strengths: Her Exhume ability (5 charges) grants 4 knowledge markers and reveals
    cards from her Forgotten Ritual Deck.  Her four Archive Breaches grant 1 knowledge
    marker per spell cast.
  weaknesses: High complexity (8) requires careful planning and knowledge token
    management.
  story_notes: |
    Raven is the mother of Xaxos in The Abyss timeline.  In The Descent, she joins
    Brama's expedition after being rescued from the ruins of Karek, becoming their
    guide through the Caverns beneath the city.  Her knowledge of the First Tribe's
    archives proves essential, and she finally has companions after years of solitude
    among green-glass statues of her frozen kin.

    Her testimony during the Blight campaign is among the bleakest in the archive:
    she describes seeing her father and uncle petrified on the field and calls the
    creature a force beyond control or comprehension.  Even so, she chooses action
    over surrender, insisting they fight through to protect the living and carry
    her daughter to safety.

    The bundle she clutches so protectively is her daughter—when battle comes, Raven
    hands the child to Myrna for safekeeping before joining the fight.  In the final
    speech about who they are fighting for, Brama names "Raven's baby girl" among
    those who matter most.
  variants:
  - box: The Descent
- id: remnant
  name: Remnant
  background: Remnant is an ethereal entity—a supernatural being that may have once
    been human.  She describes herself as "a fragment of my former self, a play of
    light with form and thought. A ghost in a world of those who will soon follow."
    She has no memory of her former identity but remains motivated to protect Gravehold.
  appearance: A non-physical, phantom-like form.  Her design reflects her ethereal
    nature as a spectral being without solid substance.
  strengths: Her Ephemera Masque ability (5 charges) lets allies retrieve two cards
    from their discard or heals Gravehold for 5 life.  Her unique Breach II grants
    +1 aether per spell cast per round.
  weaknesses: Her ethereal nature makes her fragile and dependent on allies for
    protection.
  variants:
  - box: The Outer Dark
- id: kavoc
  name: Kavoc
  background: Kavoc is an ambitious scholar devoted to researching aether and breach
    magic.  He admires past mages like Antoni Lexive, Kiri Maesan, and Kwananya Ja'ar
    and strives to surpass their legacy.  At the University of Erythiza he was part of
    a group making fundamental breakthroughs in breach magic and extra-dimensional space,
    cross-referencing findings with scientists studying corruption origins.  He discovered
    that corruption particles, smaller than the eye can see, concentrate in corrupted areas.
    He suspects a professor conducted inadvisable experiments with these particles that
    went terribly wrong.  Sleep-deprived and passionate, he says, "My hands tremble...
    When I think about the implications of my research, my vision blurs with excitement!"
    He collaborates with Auren on machines that detect breach energy readings.
  appearance: A young man with curly hair, a wild expression, and sharp blue eyes.  He
    has the worn look of someone who spends sleepless nights in research, his eyes showing
    the intensity of academic obsession.
  strengths: His Experiment ability (4 charges) lets an ally draw two cards while
    Kavoc gains 3 knowledge markers.  His swap cards Brain Lance and Soulstone
    are stronger versions of his starters.
  weaknesses: Relies on knowledge marker accumulation; requires careful deck management.
  variants:
  - box: Past and Future
- id: lilly
  name: Lilly
  background: Lilly is the daughter of Inco and Razra.  Raised with Void creatures
    as companions, she developed an unusual bond with these beings.  Her father
    taught her to see the Nameless as individuals—"some good, some bad, some angry,
    some scared, some curious. Just like us."  She followed a Void creature through
    a portal to another reality.  In the Future expedition, she is found living alone
    in the wasteland near the Changeling Nest—one of the children "collected" by the
    Changeling who somehow escaped.  Despite her unsettling origins, she remains
    relentlessly cheerful, bouncing when she walks and calling Shoshana "big ears lady."
    She knows the True Void intimately and guides her companions through its darkness.
  appearance: A young woman with an affinity for Void creatures, her black hair pushed
    into a rough bun.  Her smile shows more teeth than it should, hinting at her
    transformation.  She moves with unnatural energy and cheer.
  strengths: Her Pack Tactics ability (4 charges) lets her retrieve minions from
    discard and prep spells, or deal 3 damage to a minion.  Her minions count as
    spells dealing damage based on nemesis tier (3/6/9).
  weaknesses: Dependent on minion cards; struggles without her creature companions.
  variants:
  - box: Past and Future
- id: naftir
  name: Naftir
  background: Naftir is a descendant of Xaxos, a man corrupted by the Void.  He says,
    "Spending time in the Void changes a person. It twists them, deep down."  His
    great-grandmother grew up in the Void, and Naftir is "still paying the price even
    after all these years."  Though he has never entered the Void himself, he knows
    its dangers intimately through family stories and lore.  Pragmatic and cautious,
    he urges companions to think before rushing into the Void, even when someone they
    love has been taken.  In the Duskling Tower, he confronts Corruption's Core—a creature
    that bears his features, a dark reflection of his bloodline.  When they meet, Naftir's
    eyes glow blue as the corruption recognizes something of itself in him.
  appearance: Known as the Void Inheritor, his appearance hints at the corruption
    lurking in his bloodline.  His eyes carry the weight of ancestral darkness, and
    in moments of confrontation with void creatures, they glow an eerie blue.
  strengths: His Amplify ability (4 charges) places Link tokens on breaches or casts
    all prepped spells from a linked breach at once.  His Consuming Breach stacks
    spells and deals 3 bonus damage after the third.
  weaknesses: Complexity 5 requires careful token and breach management.
  variants:
  - box: Past and Future
- id: rhys
  name: Rhys
  background: Rhys is a mage whose mother wished for a daughter with natural magical
    abilities.  Lacking these gifts, he developed artificial solutions, finding old
    blueprints from an inventor named Auren and modifying them.  Over time he
    implanted mechanical components—shoulders, chest, neck, hands—saying "I could
    not stop improving."  Grumpy and antisocial, he prefers fishing alone in the river
    to dealing with people.  "I hate people," he mutters, though he fights alongside
    his companions when danger strikes, even when it costs him injuries like the cut
    on his wrist from battle.  Beneath his gruff exterior lies unexpected depth—"We
    all have our own dark side," he observes, accepting moral complexity in others
    where some see only threat.
  appearance: Part human, part machine, part magic.  He has mechanical prosthetics
    on various body parts, making him a hybrid of biological and mechanical being.
    Often found knee-deep in the river with a fishing rod.
  strengths: His Loop Data ability (6 charges) lets him acquire up to two spells
    costing 5 or less and retrieve up to two spells from discard.  He can control
    up to 6 breaches.
  weaknesses: Complex breach management with up to 6 artificial breaches requires
    significant aether investment.
  variants:
  - box: Past and Future
- id: shoshana
  name: Shoshana
  background: Shoshana comes from a family of Tethers from the swamp village Faen.
    A descendant of Tyreesia and Kiryra, she was initially forbidden from becoming
    a Tether by her grandmother who believed "love is a weakness."  Shoshana
    rejects this, saying "I do not believe love is a weakness."  She has enhanced
    senses—advanced auditory implants that let her detect approaching people from
    great distances.  Patient and observant, she often lies in the grass, sensing the
    world around her before springing into action.  Her tether bond to Harmony runs
    deep—when Harmony was pulled into the Void, Shoshana's guilt erupted into boiling
    rage.  "We can't just abandon her!" she snarled, her patience giving way to fierce
    protectiveness.
  appearance: A mage with characteristic tattoos symbolizing her role as a Tether,
    and subtle mechanical enhancements to her hearing.  Her design reflects her bond
    with her chosen ally and her heightened awareness.
  strengths: Her Redirect Flow ability (6 charges) lets her tethered ally take an
    extra turn after hers.  At game start she chooses an ally who receives a Tether
    token and replaces a starter card with Soul Facet.
  weaknesses: Dependent on her tethered ally; if they struggle, so does she.
  variants:
  - box: Past and Future
- id: kain
  name: Kain
  background: Kain is a character who sees beauty in the Void where others see only
    corruption.  She serves as a moral eye for her companions, saying "I will be
    their eyes," and dances for life, change, and beauty.
  appearance: Known as The Dancer, she moves with grace and sees wonder in darkness.
    Her design reflects her artistic, movement-based approach to magic.
  strengths: Her Void Waltz ability (4 charges) either deals 2 damage to Gravehold
    to give a player 6 aether (if Gravehold has 15+ life) or heals Gravehold for 5.
    Her Spirit Breach adds +1 damage and grants an ally an aether token.
  weaknesses: Requires Gravehold to have high health to access her offensive mode.
  variants:
  - box: Tales of Old Gravehold
- id: xae
  name: Xae
  background: Xae is the Captain of the Mage's Faction from the world of One Deck
    Dungeon.  Chosen by her council to explore Gravehold as dark artifacts appear
    in her world, she brings a lifetime of elemental magic study and carries a staff
    notched with memories of goblins slain and ogres laid to waste.
  appearance: A regal mage carrying a battle-worn staff.  Her bearing reflects both
    scholarly knowledge and practical combat experience.
  strengths: Her Spell Storm ability (4 charges) lets her cast a prepped spell from
    her Vortex Deck three times, then destroy it.  Her Vortex Breach permanently
    adds +1 damage per cast.
  weaknesses: Once spells from her Vortex Deck are destroyed, they cannot be recovered.
  variants:
  - box: Promo Pack 1 (Digital)
- id: tressa
  name: Tressa
  background: Tressa is a treasure hunter who learned breach magic more for survival than prestige. She deflects lectures about duty with jokes and bravado, but beneath the swagger she cares fiercely for her city and the people she loves. In The Returned era she explicitly frames frontline risk through the lens of parenthood, measuring danger against the future she wants for her son, Nook.
  appearance: A wiry mage with teal hair and tattooed arms, dressed in scavenger gear with satchel straps and tools for cracking relic vaults.
  strengths: Tressa's Vault gives her access to level 3 treasures and lets her open with tailored relic power, making her exceptionally flexible in long, technical battles.
  weaknesses: High-complexity setup can punish rushed decisions; if her vault plan misaligns with the fight, she loses tempo and impact.
  story_notes: In The Returned era, Tressa reframes herself from opportunistic scavenger to committed defender after becoming a parent. Her own field account during the Rampaging Vin operation highlights claustrophobic cave fighting, her frustration at being pressed into direct Nameless combat, and her resolve to endure it for Nook's future. She still chases "new shinies," but now treats each find as a way to protect New Gravehold rather than merely prove herself.
  variants:
  - box: The Returned
